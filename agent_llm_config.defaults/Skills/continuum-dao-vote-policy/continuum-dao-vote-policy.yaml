# Default ContinuumDAO votePolicy for this skill.
# Keep the votePolicy block in SKILL.md in sync — the agent loads SKILL.md.
votePolicy:
  version: 1
  defaultAction: skip          # skip | nota | against | abstain — never "for"
  keyGenId: ""                 # KeyGen that casts the vote (not a proposer filter)
  trustedProposers:
    - "0x482cdCbdd72ef307997153Ee7eb627B7a2348d34"
    - "0xd23eecBe0362F36b254F774C274823Cbfc482a10"
  blockedProposers: []
  types:
    block: [Admin]
    treasury:
      action: against          # against | nota | skip
      maxValueWei: "0"
  signatures:
    allow: []
    deny: ["transfer(", "approve(", "increaseAllowance(", "setOwner(", "upgradeTo"]
  targets:
    deny: []
    treasuryLike: []
  scam:
    rejectValueToEoa: true
    rejectUnknownTarget: true
    rejectEmptyDescriptionWithActions: true
