# trade-desk.yaml — machine-readable Build Trade prefill defaults
#
# Used by mpc-auth on the deterministic fast path when a selected trade idea is
# "clear" (no LLM-fallback rules below). Edit on the node under
# agent_llm_config/trade-desk.yaml (Skills tab → Trade desk, or POST /upsertTradeDeskConfig).
#
# Related config (not duplicated here):
#   • Skills/trade-defaults.md — policy-only LLM fallback (nearest break+retest, Donchian alternate, unclear + clear alternate, etc.)
#   • Cron job message — optional fenced `tradeBuild:` YAML overrides per scheduled run
#
# Protocol blocks are keyed by build-form protocolId (lowercase): hyperliquid, gmx, uniswap, …
# At least one protocols.* entry is required. Listing hyperliquid here does NOT make it the UI default
# protocol — the Build Trade form still picks protocol from the loaded session / operator choice.

version: 1  # Schema version (must be 1 today).

# ---------------------------------------------------------------------------
# Percentage types (read this before tuning numbers)
# ---------------------------------------------------------------------------
# The desk uses three different "%" meanings. Do not mix them up:
#
# 1) OFFSET % — entryOffsetPct (always price %), invalidationOffsetPct, targetOffsetPct (Hyperliquid)
#    entryOffsetPct is always a fraction of entry *price* (never ATR).
#    invalidationOffsetPct meaning depends on universal.invalidationOffsetMode (price | atr) — see below.
#    targetOffsetPct widens the take-profit trigger *inside* the idea target (conservative exit):
#      long → below target; short → above target. Mode: protocols.hyperliquid.targetOffsetMode.
#    See trade-defaults skill §3.
#
# 2) PROXIMITY — entryProximityPct + entryProximityMode (price | atr)
#    Gates whether an idea is "clear" (actionable) vs "unclear" during analysis /
#    idea surfacing — is last close close enough to the setup entry?
#
#    mode: price (default)
#      |lastClose − entry| / |entry| × 100  ≤  entryProximityPct
#      Example: entryProximityPct 1 → within 1% of entry price.
#
#    mode: atr
#      |lastClose − entry|  ≤  (ATR × entryProximityPct / 100)
#      ATR = average true range over entryProximityAtrPeriod bars on the analysis timeframe.
#      Example: ATR = $40, entryProximityPct 25 → gate within $10 of entry (25% of one ATR).
#      ATR mode often uses larger numbers than price mode (e.g. 15–50, not 0.5–2).
#
# 3) BAND-WIDTH % — Bollinger ideas only (not in universal:)
#    analyze_bollinger_bands uses entryProximityPct 5 on the *setup* = 5% of upper−lower
#    band width. Universal entryProximityMode/Pct do not override that BB-specific gate.
#
# Offsets (1) and proximity (2) are independent: proximity decides clear/unclear; offsets
# shift the resting limit after the operator picks a clear idea.

# ---------------------------------------------------------------------------
# universal — applied to every protocol on the fast path
# ---------------------------------------------------------------------------
universal:
  # PRICE % — perp limit band at build (bounce | retest from analysisSetup.setup).
  # Pattern/trend/key-level ideas store base entry at structure boundaries.
  # Typical: 0.5–2. Not ATR-based.
  entryOffsetPct: 1

  # Invalidation / SL band beyond pattern-failure level (§3 trade-defaults).
  # Mode: price | atr (default price). When atr, pct is % of one ATR bar (typical 15–50; default 25 if omitted).
  # Example atr desk: invalidationOffsetMode: atr + invalidationOffsetPct: 25
  invalidationOffsetMode: price
  # PRICE % when mode is price (typical 0.5–2); ATR % when mode is atr (typical 15–50).
  invalidationOffsetPct: 1

  # When true, Build Trade sends useCustomGas on EVM protocols (gmx, uniswap). Usually false.
  useCustomGas: false

  # PROXIMITY mode: price | atr (see "Percentage types" above).
  entryProximityMode: price

  # PROXIMITY threshold — meaning depends on entryProximityMode:
  #   price → % of entry price (typical 0.5–2; MA crossover often 1)
  #   atr   → % of one ATR bar (typical 15–50 for volatile symbols; see entryProximityAtrPeriod)
  entryProximityPct: 1

  # ATR lookback (bars) when entryProximityMode is atr. Standard: 14. Ignored when mode is price.
  entryProximityAtrPeriod: 14

  # Minimum Trade Ratio for CLEAR ideas (reward/risk using invalidation as risk):
  #   long  (target − entry) / (entry − invalidation)
  #   short (entry − target) / (invalidation − entry)
  # Ideas with a computable ratio below this become UNCLEAR.
  minTradeRatio: 3

  # Assumed isolated leverage for analysis-time liquidation estimate (perp venues only;
  # omitted for Uniswap / spot). long entry × (1 − 1/leverage); short entry × (1 + 1/leverage)
  assumedLeverage: 10

  # Per-leg key-level confidence (strength/100) for Fib strongest-bracket range.
  # Both the strongest level below and above last close must meet this, else fib analysis is invalid.
  # Injected into analyze_key_level_fibonacci as fibKeyLevelMinConfidence (default 0.35).
  fibKeyLevelMinConfidence: 0.35

  # Donchian channel length (bars) for analyze_donchian_breakout and chart overlay type:donchian.
  # Injected as period / donchianPeriod when the tool arg is unset. Default 20.
  donchianPeriod: 20

  # Donchian primary entry style for analyze_donchian_breakout:
  #   retest    — post-breakout retest of broken band (dc-ret); default
  #   immediate — channel break / hold beyond prior band (dc-brk)
  donchianEntryMode: retest

  # Donchian take-profit distance as a multiple of ATR (entryProximityAtrPeriod bars):
  #   Target = breakout entry ± (donchianTargetAtrMultiple × ATR). Default 3.
  # Invalidation is always the Donchian mid-channel (not this multiple).
  donchianTargetAtrMultiple: 3

  # Supertrend (analyze_supertrend + overlay type:supertrend).
  # Injected as period / supertrendPeriod and multiplier / supertrendMultiplier when unset.
  supertrendPeriod: 10
  supertrendMultiplier: 3
  # Primary entry style: flip (direction change, st-flip) | retest (trail touch, st-ret)
  supertrendEntryMode: flip
  # Target = entry ± (supertrendTargetAtrMultiple × ATR). Default 3.
  # Invalidation is always the Supertrend trail (not this multiple).
  supertrendTargetAtrMultiple: 3

  # Ichimoku cloud (analyze_ichimoku + overlay type:ichimoku).
  # Injected when tool args omit these fields. Classic defaults 9/26/52/26.
  ichimokuConversionPeriod: 9
  ichimokuBasePeriod: 26
  ichimokuSpanPeriod: 52
  ichimokuDisplacement: 26
  # Target = entry ± (ichimokuTargetAtrMultiple × ATR). Default 3.
  ichimokuTargetAtrMultiple: 3

  # Z-score mean reversion (analyze_z_score + overlay type:zscore).
  # Injected when tool args omit these fields. Default period 20.
  zScorePeriod: 20
  # Enter long when Z ≤ −entry; short when Z ≥ +entry.
  zScoreEntry: 2
  # Target when Z returns to ±exit vs mean (price = SMA ± exit × SD).
  zScoreExit: 0.5
  # Invalidation = entry ± (zScoreStopAtrMultiple × ATR). Default 2.
  zScoreStopAtrMultiple: 2
  # Optional ATR gate: none | contracting (ATR[t] < ATR[t-1]).
  zScoreAtrFilter: none

  # Divergence detector (analyze_divergence). Injected when tool args omit these fields.
  # oscillator mode: rsi | stochasticrsi | both (default both)
  divergenceOscillator: both
  # Max bars between paired price/oscillator pivots (default 3).
  divergenceMaxLag: 3

  # Spot liquidity depth (analyze_liquidity_depth). Not a Trade Idea — table + optional left-axis profile.
  # Injected when tool args omit these fields. v1 exchange: binance (spot book only).
  depthExchangeId: binance
  # Seconds between depth polls (default 12).
  depthSampleIntervalSec: 12
  # Rolling average window seconds (default 300 = 5m).
  depthAverageWindowSec: 300
  # Venue depth limit (Binance enum; default 500).
  depthLimit: 500
  # Rows in liquidity depth levelMenu (default 8).
  depthLevelCount: 8

  # When true, cron or automation may submit multisign without operator review (interactive UI still
  # shows the form unless cron tradeBuild also sets this). Default false — require human confirm.
  autoSubmitMultisign: false

  # Optional multisign expiry: minutes from prefill/build time. Omit to use protocol default / no expiry.
  # expiryMinutesFromNow: 60

# ---------------------------------------------------------------------------
# llmFallback — when set, skip the fast path and run trade-defaults skill via LLM
# ---------------------------------------------------------------------------
llmFallback:
  # Idea status "unclear" (price not near entry, conflicting structure, etc.) → LLM decides offsets/alternate.
  whenStatusUnclear: true

  # Primary idea unclear but nested breakRetestAlternative.status is "clear" → LLM picks primary vs alternate.
  whenBreakRetestAlternateEligible: true

  # Always use LLM for these setupPurposeCode values (even if status is clear):
  #   kl-ret — nearest key-level break + retest alternate
  setupPurposeCodes:
    - kl-ret

# ---------------------------------------------------------------------------
# protocols — per-venue defaults (key = protocolId from Build Trade)
# ---------------------------------------------------------------------------
protocols:

  # --- Hyperliquid (perp / spot) -------------------------------------------------
  hyperliquid:
    # perp | spot — default market for HL build when not overridden in the form.
    marketKind: perp

    # Time-in-force for limit orders: gtc | ioc | alo (venue-specific).
    tif: gtc

    # Hyperliquid bracket (TP/SL on open) — when trade idea has target and/or invalidation:
    # targetOffsetPct: conservative TP inside analysis target (long: below target; short: above).
    #   mode price → % of target price (typical 0.5–2; 0 = exact target).
    #   mode atr   → % of one ATR bar from analysis OHLCV (typical 15–50; uses atrAtLastBar on idea).
    targetOffsetPct: 0.1
    targetOffsetMode: price
    # tpslExecMode: limit_at_trigger (default — resting limit at trigger px) | market (HL 10% slippage).
    tpslExecMode: limit_at_trigger

    sizing:
      # Primary: marginPct sizes from withdrawable balance (one fetch_open_context when HL tools are loaded).
      # fixedSzHuman below is NOT the primary mode — it is used only when marginPct cannot run
      # (open-context unavailable, missing executor, etc.) so prefill stays on the desk fast path.
      mode: marginPct
      marginPct: 10          # % of withdrawable USD notional (marginPct mode only)
      minSzHuman: "0.001"    # Floor coin size after marginPct calc (string decimal)
      fixedSzHuman: "0.05"   # Fallback coin size (ETH units here) when marginPct path fails — HL block only

    # Appended to auto-generated purposeText (256 char total limit). Keys match analysis type:
    # trend_structure | chart_pattern | key_levels | key_level_fibonacci | bollinger_bands |
    # donchian_breakout | supertrend | ichimoku | z_score | moving_averages | elliott_waves |
    # candlestick | momentum | divergence | default
    purposeSuffix:
      trend_structure: "trend retest"
      chart_pattern: ""
      key_levels: "kl bounce"
      key_level_fibonacci: "fib 618 fade"
      bollinger_bands: "bb fade"
      donchian_breakout: "dc breakout"
      supertrend: "st trail"
      ichimoku: "ichi cloud"
      z_score: "zs fade"
      moving_averages: "ma setup"
      elliott_waves: "ew wave"
      candlestick: "candle confirm"
      momentum: "mom confirm"
      divergence: "div confirm"

  # --- GMX (EVM perps) -----------------------------------------------------------
  gmx:
    collateralToken: USDC   # Collateral symbol for GMX build payload

    sizing:
      mode: fixed             # GMX fast path expects fixed USD + collateral (not marginPct)
      sizeUsdHuman: "500"     # Position size in USD (string decimal)
      collateralAmountHuman: "150"  # Collateral to post (string decimal)

    purposeSuffix:
      trend_structure: "trend retest"
      chart_pattern: ""
      key_levels: "kl bounce"
      key_level_fibonacci: "fib 618 fade"
      donchian_breakout: "dc breakout"
      supertrend: "st trail"
      ichimoku: "ichi cloud"
      z_score: "zs fade"
      elliott_waves: "ew wave"
      divergence: "div confirm"

  # --- Uniswap (spot swap) -------------------------------------------------------
  uniswap:
    sizing:
      mode: fixed
      sizeUsdHuman: "100"     # Swap notional in USD

    purposeSuffix:
      default: "spot swap"

  # --- Arcus (Robinhood Chain 4663 — perps + spot Stock Tokens) ------------------
  arcus:
    # perp | spot — perp uses limit + optional bracket; spot uses RFQ (no TP/SL at build).
    marketKind: perp

    # Time-in-force for perp limit orders: gtc | ioc (venue-specific).
    tif: gtc

    # Perp bracket (TP/SL) when trade idea has target and/or invalidation — same geometry as Hyperliquid.
    targetOffsetPct: 0.1
    targetOffsetMode: price
    tpslExecMode: limit_at_trigger

    sizing:
      mode: fixed
      fixedSzHuman: "0.05"   # Coin size (e.g. ETH units) — required for perp/spot RFQ builds
      minSzHuman: "0.001"

    # Trading requires paired KeyGens (same GroupId): secp256k1 (custody/billing) + ed25519 (API signing).
    # Set ed25519KeyGenId on build_trade_from_* / tradeBuild YAML when automating cron (UI session may supply it).

    purposeSuffix:
      trend_structure: "trend retest"
      chart_pattern: ""
      key_levels: "kl bounce"
      key_level_fibonacci: "fib 618 fade"
      donchian_breakout: "dc breakout"
      supertrend: "st trail"
      ichimoku: "ichi cloud"
      z_score: "zs fade"
      elliott_waves: "ew wave"
      divergence: "div confirm"
      default: "arcus perp"

# ---------------------------------------------------------------------------
# Examples (commented — copy into protocols.* to try alternatives)
# ---------------------------------------------------------------------------
#
# marginPct-only HL sizing with a larger fallback probe (still HL-specific, not a global default):
#   hyperliquid:
#     sizing:
#       mode: marginPct
#       marginPct: 10
#       fixedSzHuman: "0.02"
#       minSzHuman: "0.001"
#
# Wider proximity — ATR-based (volatile alts / higher timeframes):
#   universal:
#     entryProximityMode: atr
#     entryProximityPct: 25      # within 25% of one 14-bar ATR
#     entryProximityAtrPeriod: 14
#     entryOffsetPct: 1          # offsets stay PRICE % (unchanged)
#     invalidationOffsetPct: 1
#
# Hyperliquid TP offset on ATR (conservative — inside analysis target):
#   hyperliquid:
#     targetOffsetMode: atr
#     targetOffsetPct: 25        # 25% of one ATR bar below/above target
#     tpslExecMode: limit_at_trigger
#
# MA proximity retest on ATR (moving_averages ma-ret reads desk mode):
#   universal:
#     entryProximityMode: atr
#     entryProximityPct: 20
#     entryProximityAtrPeriod: 14
#
# Disable LLM for unclear status (fast path only when status is clear):
#   llmFallback:
#     whenStatusUnclear: false
#     whenBreakRetestAlternateEligible: false
#     setupPurposeCodes: []
