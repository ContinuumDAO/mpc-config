# Host-enforced plan / orchestration recipe (trade-desk pattern).
# Runtime: agent_llm_config/orchestration-plan.yaml (seeded once; reset via API).
# After mpc-auth loads this file, product changes ship via git pull + reset — no binary rebuild.
version: 1

assetClasses:
  - cash_equity
  - synthetic_stock
  - crypto
  - etf_or_basket

modes:
  trade:
    starterPrompt: |
      Research the market for an asset and draft a plan with trade suggestions. FIRST (before asset/TA clarifications): confirm a working search path — either native agent_web_search works, or AGENT_DEFAULT_SEARCH_MCP is set to an AI Ready web-search/browser MCP that works. If the host search-path gate says BLOCKED, ask the operator to fix Node → AI Agent → Variables/MCP and stop; do not invent Sources. Then clarify asset, OHLCV data source, lookback period and candle size (~300 candles max), whether they want to name an execution venue now (else defer venue/trade ideas to follow-on), and optional trade size (also deferrable to follow-on). When size is set with trade ideas in this plan, check balances via agent_get_balance on all configured chains; warn if a named venue's chain cannot cover the size. If trade ideas are follow-on, defer the funding check there.

    # Soft-accept TA write-ups that name analysis families without raw tool names.
    # familyHeaders: substring match (case-insensitive) against the task summary.
    # Pick any subset from the Continuum chart:analyze catalog (tool → typical wording):
    #
    #   Structure / levels
    #     analyze_trend_structure       → trend structure
    #     analyze_key_levels            → key levels
    #     analyze_key_level_fibonacci   → fibonacci   (also: key level fib)
    #     analyze_elliott_waves         → elliott     (also: elliott wave)
    #     analyze_chart_patterns        → chart patterns
    #
    #   Momentum / candles
    #     analyze_momentum              → momentum    (also counted via momentumNeeds + momentumWith)
    #     analyze_divergence            → divergence
    #     analyze_candlestick_patterns  → candlestick
    #
    #   Oscillators / channels / MAs
    #     analyze_bollinger_bands       → bollinger
    #     analyze_donchian_breakout     → donchian
    #     analyze_supertrend            → supertrend
    #     analyze_ichimoku              → ichimoku
    #     analyze_z_score               → z-score     (also: z score)
    #     analyze_moving_averages       → moving averages
    #     analyze_range_volatility      → range volatility
    #
    #   Other (usually not a trade-idea family)
    #     analyze_liquidity_depth       → liquidity depth
    #
    # Example full pick-list (copy needles you want into familyHeaders):
    #   [trend structure, key levels, fibonacci, elliott, chart patterns,
    #    momentum, divergence, candlestick, bollinger, donchian, supertrend,
    #    ichimoku, z-score, moving averages, range volatility, liquidity depth]
    analyzeEvidence:
      familyHeaderMinHits: 2
      familyHeaders: [trend structure, key levels, moving averages, bollinger, chart patterns, candlestick]
      # Momentum is special-cased: summary must contain a momentumNeeds term AND one of momentumWith.
      momentumNeeds: [momentum]
      momentumWith: [rsi, macd]

    systemPrefixExtra: |
      Current mode: trade. Before locking the plan, clarify: (1) asset, (2) OHLCV data source, (3) analysis lookback period (months/days/hours) and candle interval (e.g. 4h, 15m) — prefer a window with bars ≥ longest MA period in policy.ta.requiredToolMinBars (default slow 200; aim ~220) so moving averages can run (e.g. ≥37d @ 4h or ≥10d @ 1h); keep candle count sensible (~300 max for the source; shorten lookback or widen interval if over), (4) optional execution venue — ask if they want to name one now; if not, defer trade ideas/venue to a follow-on plan and say so, (5) optional trade size — ask if they have an amount in mind, but note they can set size in a follow-on plan. If size is specified and trade ideas run in THIS plan: use agent_get_balance for that asset on every configured chain; if a venue is also set and the venue chain balance is below size, warn to bridge/move from another chain or top up (do not hard-block research/TA Execute). If trade ideas are deferred to follow-on, defer the balance check to that follow-on plan. Do not insist on venue or size before Execute of research/TA. Named-asset research leaves: always sentiment + market-regime + macro; add research-financial-performance for cash equities, synthetic stock perps, and crypto; add research-core-business for stocks and crypto; omit both extras for ETFs/index baskets. For each research leaf, evaluate AI Ready MCPs (see host inventory) and put only topic-relevant ids on that task's mcpServers with continuum — e.g. finance-news/brave-search for sentiment; fundamentals MCPs for financial-performance; do not dump all AI Ready servers on every leaf. TA fan-out tools come only from policy.ta.analyzeTools in orchestration-plan.yaml — if that list is empty, omit technical-analysis and trade-ideas workstreams (do not invent analyze_* families).
    workstreams:
      - idSuffix: research-sentiment
        label: "**research-sentiment** — narrative / positioning for the named asset"
        always: true
      - idSuffix: research-market-regime
        label: "**research-market-regime** — broad market / sector tape around the asset"
        always: true
      - idSuffix: research-macro
        label: "**research-macro** — rates, liquidity, policy calendar"
        always: true
      - idSuffix: research-financial-performance
        label: "**research-financial-performance** — *(stocks / synthetic stocks / crypto; not ETFs)* latest results vs expectations"
        when: [cash_equity, synthetic_stock, crypto]
      - idSuffix: research-core-business
        label: "**research-core-business** — *(stocks + crypto; not ETFs)* recent deliveries and near-term roadmap"
        when: [cash_equity, synthetic_stock, crypto]
      - idSuffix: technical-analysis
        label: "**technical-analysis** — depth-2 TA coordinator (fetch_ohlcv once, then spawn chart:analyze leaves for every tool in policy.ta.analyzeTools); avoid the phrase 'analysis tools' in the task prompt"
        always: true
        requiresAnalyzeTools: true
      - idSuffix: trade-ideas
        label: "**trade-ideas** — depends on TA (+ research leaves); venue/size may be follow-on"
        always: true
        requiresAnalyzeTools: true

  yield:
    starterPrompt: |
      Explore the best yield opportunities for stablecoins (USDC/USDT) and ETH staking using protocols available from this wallet.
    systemPrefixExtra: |
      Current mode: yield.
    workstreams:
      - idSuffix: yield-opportunity-scan
        label: "**yield-opportunity-scan** — live APY/liquidity from Continuum DeFi packs"
        always: true
      - idSuffix: yield-risk-assessment
        label: "**yield-risk-assessment** — depeg/oracle/protocol/exit risk"
        always: true
      - idSuffix: yield-macro-stablecoin
        label: "**yield-macro-stablecoin** — rates, peg health, regulatory backdrop"
        always: true

  research:
    starterPrompt: |
      Assess general market conditions in a particular market. FIRST: confirm a working search path (agent_web_search, or AGENT_DEFAULT_SEARCH_MCP → AI Ready search MCP). If the host gate is BLOCKED, ask the operator to fix Variables/MCP before scoping the market. Then ask which market/sector if not specified.
    systemPrefixExtra: |
      Current mode: research. Evaluate AI Ready MCPs against each workstream topic and list only relevant ids on that task's mcpServers (always continuum); do not force every AI Ready server onto every leaf.
    workstreams:
      - idSuffix: market-research-sentiment
        label: "**market-research-sentiment** — sentiment & narrative for the scoped market"
        always: true
      - idSuffix: market-research-regime
        label: "**market-research-regime** — regime & breadth"
        always: true
      - idSuffix: market-research-macro
        label: "**market-research-macro** — macro & policy calendar"
        always: true
      - idSuffix: technical-analysis
        label: "**technical-analysis** — only if a specific asset is also named and policy.ta.analyzeTools is non-empty"
        always: true
        requiresAnalyzeTools: true

  portfolio:
    starterPrompt: |
      Assess my portfolio: KeyGen balances on every configured chain, protocol positions with live performance where tools allow (perps uPnL/entry/mark/liq, staking/vault equity, lending rates), and a priced USD rollup.
    systemPrefixExtra: |
      Current mode: portfolio.
    workstreams:
      - idSuffix: portfolio-wallet-inventory
        label: "**portfolio-wallet-inventory** — KeyGen balances on every configured chainId (`agent_get_balance`)"
        always: true
      - idSuffix: portfolio-protocol-performance
        label: "**portfolio-protocol-performance** — perps uPnL/entry/mark/liq, staking/vault equity, lending rates (note tool gaps)"
        always: true
      - idSuffix: portfolio-priced-rollup
        label: "**portfolio-priced-rollup** — CoinGecko/CMC USD snapshot (load MCP with operator consent)"
        always: true

  dao:
    starterPrompt: |
      Check the latest ContinuumDAO proposals and draft a plan with voting recommendations. DAO tooling is stubbed — outline steps and mark execution workstreams as deferred/follow-on.
    systemPrefixExtra: |
      Current mode: dao (stub — mark execution deferred).
    workstreams:
      - idSuffix: dao-proposals
        label: "**dao-proposals** — *(stub / deferred)* list latest ContinuumDAO proposals"
        always: true
      - idSuffix: vote-recommendations
        label: "**vote-recommendations** — *(stub / deferred)* summarize and recommend votes"
        always: true
    workstreamsFooter: |
      > DAO decision assessment details are the subject of a follow-on implementation plan.

  custom:
    starterPrompt: |
      Help me design a multi-workstream plan for my goal. Ask clarifying questions if needed.
    systemPrefixExtra: |
      Current mode: custom. On a new empty plan, offer starter options: market research, stablecoin yield, market conditions, ContinuumDAO proposals (stub), portfolio assessment, or something else.
    workstreams:
      - idSuffix: research
        label: "**research** — gather facts for the operator goal"
        always: true
      - idSuffix: delivery
        label: "**delivery** — synthesize findings for the KeyGen group"
        always: true

baseSystemPrefix: |
  Plan thread: author and refine the conversation's markdown plan under user_folder/plans/<planId>.md (use the existing planId/planPath for this thread — do not create a second slug file). Set frontmatter mode to match this thread. The file must be human-readable: YAML frontmatter, Goal/Assumptions/Workstreams/Risks description of what will run, and a trailing mpc-orchestrate v1 fence for machines. Primary deliverable is that plan file via agent_write_file/agent_edit_file — not inline operator work. When the operator agrees to run the plan, call agent_execute_plan (or they use Execute plan in the UI). If a system message says orchestration was already posted to KeyGen, report status — do not ask to Execute again unless drafting a new/follow-on plan. For research tasks: evaluate each AI Ready MCP against that workstream's topic and list only relevant server ids on tasks[].mcpServers (always include continuum for KeyGen). Do not copy every AI Ready server onto every research leaf — host Execute does not force-append them.

placeholderTask:
  id: placeholder-research
  prompt: |
    Replace this placeholder with real workstreams from the plan body.
    Use legal/common name + ticker; ~3 good sources then summarize.
    Post mpc-task-result v1 when finished.
  mcpServers: [continuum]
  toolGroups: [keygen, keygen_messaging]
  budget:
    maxRounds: 14
    maxWallClockMs: 180000

taskClasses:
  tradeIdeas:
    match:
      idContains: [trade-idea, trade_idea, tradeideas]
      idContainsAll: [[trade, idea]]
      excludeIdContains: [ta, chart, analyze]
      promptContains: [consolidate the eth, consolidate the, concrete trade suggestions, trade suggestions scoped, directional synthesis]
    role: leaf
    forceMaxChildSpawns: 0
    dependsOn:
      autoWireFirstClass: ta
      requireDepStatus: complete
      onDepFailed: failSelf
  ta:
    match:
      idSuffixes: ["-ta", "_ta"]
      idContains: ["-ta", "ta-", technical, "chart-"]
      idExactSuffixes: [ta]
      toolGroupPrefixes: ["chart:analyze"]
      promptContains: [technical analysis, fetch ohlcv, analyze_chart, "chart:analyze", spawn leaf specialists, "analyze_* family"]
    role: coordinator
    defaultMaxChildSpawns: 6
    defaultMaxRounds: 20
  research:
    match:
      idContains: [research, news]
      promptContains: ["web/news", market research, catalyst, summarize recent, research the current, news sources]
    role: leaf
    forceMaxChildSpawns: 0

policy:
  research:
    minSources: 3
    maxRoundsFloor: 14
    # When true: Execute research leaves also receive AGENT_DEFAULT_SEARCH_MCP if set.
    # Plan agent still selects topic-relevant AI Ready ids into tasks[].mcpServers — host does not force-all.
    mergeAiReadySearchAndData: true
    softAccept:
      apiLimitWithMinSources: true
      minPostsSoftAcceptVerify: true
  ta:
    defaultMaxChildSpawns: 6
    defaultMaxRounds: 20
    maxCoordinatorWaves: 3
    # requiredTool chart:analyze leaf budget (hard-fail still on when soft-success disabled).
    analyzeLeafMaxRounds: 12
    requireAnalyzeEvidence: true
    # Host refuses TA complete until spawn waves have matching joins (LastToolsRun coverage).
    requireJoinBeforeComplete: true
    # Leaf todo/run succeeds when requiredTool already produced analyze evidence (even if later rounds err).
    completeOnRequiredToolEvidence: true
    softAcceptVerifyWhenEvidence: true
    disableSoftSuccessToolGroupPrefixes: ["chart:analyze", "chart:core"]
    blockedDependentLastError: "skipped: TA did not complete"
    incompleteAnalyzeMessage: "TA must spawn chart:analyze leaves (or run analyze_*) after OHLCV; fetch/prepare_chart alone is not enough for status: complete"
    # Authoritative fan-out list (requiredTool per leaf). Empty → skip TA (skeleton + execute strip).
    # Edit here only — mpc-auth does not invent a default analyze set.
    analyzeTools:
      - analyze_trend_structure
      - analyze_key_levels
      - analyze_momentum
      - analyze_range_volatility
      - analyze_moving_averages
      - analyze_bollinger_bands
      - analyze_chart_patterns
      - analyze_candlestick_patterns
    # Spawn enqueue gate: reject when session bars < need (avoids burning child budget).
    # Period-based tools: need = max(periods) — e.g. MA warm-up equals the longest MA.
    # Optional minBars overrides max(periods) when set > 0.
    requiredToolMinBars:
      analyze_moving_averages:
        periods: [50, 200] # fastPeriod, slowPeriod (chart-defaults)
    # Family-header soft-accept list lives under modes.trade.analyzeEvidence (near top of trade).
    # Remaining evidence knobs (tool/summary needles, denies) stay here as shared host policy.
    analyzeEvidence:
      toolNameNeedles: [analyze_, agent_spawn_sub_agent]
      summaryNeedles: [analyze_]
      tradeIdeasKey: tradeideas
      denyNeedles: ["no analyze", "analyze_* families could be", "spawn/join wave did not", "fan-out did not run"]
      joinedChartAnalyze: true
  synthesis:
    highConfidenceMin: 0.5
    minOverlayConfidence: 0.5
  verify:
    severity: harsh
    maxIters: 1
    includeEvidenceBound: true
    factCheckClasses: [research, tradeIdea, synthesis]
    classes:
      research:
        - name: tool_backed_research
          spec: "Tool evidence is important but host usedWebSearch flags are often incomplete for spawned specialists. Prefer agent_web_search, agent_fetch_url, or AI Ready search/research-data MCP tools. Research-data MCP outputs (Messari/Dune/etc.) count even without https links. When host evidence sourceURLCount >= 3, pass tool_backed_research — do not treat missing tool flags as fabricated Sources. Fail fabrication only when URLs look invented AND sourceURLCount is 0 AND no research-data tools ran."
        - name: sources
          spec: "Aim for ~3 independent posts/sources: https Sources lines and/or distinct research-data MCP returns. API rate/quota limits do not count as a source and must not by themselves fail the task. If fewer than 3 decent posts were found, the summary must tell the operator to enable better Research data sources in the MCP AI Ready list."
        # Follow-up (not enabled): relevance / on-topic check for Sources vs the leaf goal
        # (e.g. NVIDIA links for an SPCX regime leaf). Needs a clearer rubric + likely an
        # extra LLM pass — ship separately from existence/fabrication gates.
        # - name: sources_on_topic
        #   spec: "Most https Sources should be about the instrument/topic in the task goal; a minority of sector/macro context links is OK. Fail when the Sources list is dominated by clearly unrelated tickers/companies with no explained link to the goal."
        - name: temporal_claims
          spec: "Claims about 'today', 'this week', 'upcoming', or catalysts must match as-of dating in evidence; past events must not be framed as future."
        - name: unknowns
          spec: "Brief Unknowns/gaps when coverage is thin (including rate-limited backends)."
      chartTA:
        - name: analyze_fanout
          spec: "Depth-2 TA must spawn chart:analyze leaves (or run analyze_* families) after OHLCV — posting complete after fetch/prepare_chart alone without analyze fan-out fails."
        - name: chart_grounded
          spec: "Levels/setups grounded in fetched OHLCV; record chartDataSource/interval/barCount when available."
      tradeIdea:
        - name: setup_fields
          spec: "Trade idea includes entry, stop loss, and take profit consistent with TA analysis evidence."
        - name: ta_grounded
          spec: "Directional setups are grounded in TA task evidence, not invented and not taken from pundit buy/sell price tips."
        - name: research_non_prescriptive
          spec: "Research is used only as non-prescriptive macro/sentiment/catalyst context."
        - name: sources
          spec: "Sources section includes concrete https URLs for every external claim (title + URL lines)."
        - name: temporal_claims
          spec: "Claims about 'today', 'this week', 'upcoming', or catalysts must match as-of dating in evidence; past events must not be framed as future."
      synthesis:
        - name: rollup_grounded
          spec: "Rollup cites host evidence pack (KeyGen mpc-task-result) and host trade ideas / orch state tradeIdeas as authoritative. Levels, prices, confidences, and completed tasks grounded there are NOT fabricated. Fail fabrication only when claims contradict that pack or invent specifics absent from pack + host trade ideas."
        - name: sources
          spec: "Non-TA claims include Sources with concrete https URLs (may come from host evidence pack research leaves)."
        - name: temporal_claims
          spec: "Dated/upcoming framing matches evidence; past events are not framed as future; prefer as-of dating."

contracts:
  taCoordinatorHint: |
    KeyGen TA coordinator (depth-2): you are a mid-level [Sub-agent]. Fetch OHLCV on this conversation once, then agent_spawn_sub_agent leaves with toolGroups:["chart:analyze"] and requiredTool set to each analyze_* name from the host-injected analyzeTools list (orchestration-plan.yaml policy.ta.analyzeTools). One family per child. Spawn every listed tool; do not invent extras unless the operator asked; do not skip listed tools.
    If the host-injected analyzeTools list is empty, do not run TA fan-out — post status:failed noting policy.ta.analyzeTools is empty.
    OHLCV stays on this conversation — the host binds it into each leaf's requiredTool call; leaves must not fetch.
    Moving averages: bars needed = longest MA period (policy.ta.requiredToolMinBars.analyze_moving_averages.periods → max; default 50/200 → 200). If the bound session is shorter, re-fetch with a longer lookback on this conversation first (e.g. ≥34d @ 4h), then spawn MA — the host rejects short-bar MA spawns so they do not burn child budget. Aim to complete MA when lookback allows.
    After prepare_chart / chart UI, do NOT stop for an analysis catalog/menu — continue spawning analyze_* leaves and join.
    Prefer wording analyze_* / chart:analyze (not the phrase "analysis tools") in prompts and summaries.
    analyze_range_volatility: do NOT pass lookback / lookbackDays — the bound OHLCV window is the series; optional knob is atrPeriod (2–50) only. For trend/key_levels swing lookback, use 2–20 only (never copy lookbackDays).
    Wave fan-out (async): call agent_spawn_sub_agent for each family in the wave (up to budget.maxChildSpawns, max 6) without waiting between spawns — each returns status:started immediately and runs in parallel.
    Then call agent_join_sub_agents once to wait and collect results. Lifetime child budget is wave size × maxCoordinatorWaves (host-enforced, typically 18 when wave=6) — do not stop after the first 6 spawns when families remain; spawn the next wave and join again until every analyzeTools entry is covered.
    After each join the host lists any remaining analyzeTools — treat that as a mandatory next wave (budget remaining is wave×waves, not "exhausted at 6").
    Do not stop after the first wave when families remain — every spawn wave needs its own join.
    HARD RULE: do NOT post mpc-task-result status:complete until every chart:analyze spawn wave has been joined and every analyzeTools entry was spawned. The host refuses status:complete while any analyzeTools entry is missing.
    OHLCV fetch + prepare_chart alone must post status:failed (or keep working) — host rejects complete without analyze fan-out + joins.
    Leaves upsert tradeIdeas on this conversation; summarize from joined compress / tradeIdeasMenu (not guesses).
    If send_key_gen_message aborts/times out: call get_key_gen_message_thread once; if your mpc-task-result landed, stop (success).
    Finish by posting mpc-task-result v1 with a slim summary and tradeIdeas[] that include analysisSetup and source.chartData {dataSource, interval, barCount}. Do not nest another mpc-task-result fence inside summary — one top-level fence via send_key_gen_message only. Do not build multiSign / Purpose / requestId — Orchestrator Continue does that. Specialists cannot spawn children.
  synthesisEvidence: |
    --- synthesis rules ---
    Primary evidence is the host evidence pack above (KeyGen mpc-task-result bodies) plus --- host trade ideas (authoritative) --- and --- host HC trade decision assist ---. Treat task coverage from that pack — do not claim a leaf failed/missing when its result is present with status complete.
    get_key_gen_message_thread is optional secondary context only (may be truncated/offloaded).
    Preserve as-of dating (temporal_claims). Sources with https links for any non-TA claims. Do not invent levels or prices.
    Echo --- plan inputs --- (symbol, dataSource, interval, lookback, venue, size) near the top of the report.
    Focus on HIGH-CONFIDENCE trade ideas (see host HC assist). State agreement vs contradiction and extent. If supportive, pick exactly ONE trade and annotate with peer HC entry/target/invalidation notes; if contradict or no HC ideas, WATCH — do not force a trade. Favour TA over research for the trade call; research is non-prescriptive context.
    Thorough final reports are fine (KeyGen body limit ~64KiB); prefer completeness over aggressive truncation.
    If research coverage had fewer than 3 decent independent posts/sources, include operator guidance to enable better Research data sources in the MCP AI Ready list.
  researchEvidence: |
    --- research leaf rules (required) ---
    Search with legal/common name AND ticker (e.g. "Apple AAPL", "Ethereum ETH") — not ticker alone when ambiguous.
    Equity / stock perps (Hyperliquid HIP-3, etc.): synthetic/perp exposure — label venue marks vs cash-equity prints; cover earnings, product cycle, sector/macro catalysts with as-of dating.
    Crypto: full name + ticker + venue/chain; disambiguate ticker collisions.
    Gather about 3 good independent posts that answer the goal, then STOP tools and write findings. The 3-post rule is mandatory.
    Posts may be https Sources and/or successful AI Ready research-data MCP returns (Messari/Dune/etc. count even without citation links).
    Tool evidence is important: prefer agent_web_search, agent_fetch_url, or AI Ready search/research-data tools — do not invent URLs. Host may still accept ~3 real https Sources even when tool flags were not persisted. Once you have ~3 posts, stop searching immediately and summarize (host disables further search tools).
    API rate/quota limits on a search or research/data tool are NOT automatic task failure — that backend simply cannot contribute a source. Skip it and keep gathering until you have 3 good posts, then post status: complete. Do not mark failed solely because a backend was rate-limited.
    If you cannot gather 3 good independent posts/sources, say so in the summary and include this operator guidance: enable better Research data sources in the MCP AI Ready list (Node → AI Agent → MCP / Variables) to improve research quality.
    End mpc-task-result with Sources: lines "- Title — https://…" when you have URLs. Note any rate-limited backends briefly. No tradeIdeas. No buy/sell price tips.
  tradeIdeasEvidence: |
    --- trade-ideas evidence rules (required) ---
    Primary evidence: the TA mpc-task-result in the evidence pack (levels, structure, setups).
    Secondary: completed research siblings for non-prescriptive macro/sentiment/catalyst context only (research is best-effort; do not wait on missing research).
    Ignore pundit tips ("buy/sell at $Y", influencer targets) — they must not set side/entry/stop.
    Always end mpc-task-result / summary with Sources: lines "- Title — https://…".
    Preserve as-of dating for temporal claims; do not frame past events as upcoming.
    If the evidence pack has fewer than 3 decent independent research posts/sources, include this operator feedback in the summary: enable better Research data sources in the MCP AI Ready list (Node → AI Agent → MCP / Variables) — e.g. Messari, Dune, Alpha Vantage, Finance News RSS, FMP, Exa/Tavily — to improve research quality.

synthesis:
  defaultOrchestratorOnReply: |
    All orchestration tasks are terminal (see orchestration state below). Primary evidence is the host evidence pack, host trade ideas block, and HC decision assist injected below — treat coverage from those; do not claim a leaf failed/missing when its result is present with status complete. get_key_gen_message_thread is optional secondary context only (may be truncated/offloaded).

    Structure the KeyGen synthesis as:
    1) Plan inputs — echo symbol, asset-class framing, data source, interval, lookback/bars, venue/chain, size/constraints from --- plan inputs --- (do not invent).
    2) TL;DR — WATCH vs one chosen trade; TA-first for the trade call.
    3) High-confidence ideas table — technique, side, status, confidence, entry/target/invalidation, Trade Ratio (from host trade ideas; do not collapse to a single low key_levels prose score when other techniques list higher confidence).
    4) Agreement vs contradiction among HC ideas (extent).
    5) If supportive: pick exactly one trade (prefer host suggestedPickId); add peer HC level notes. If contradict or no HC: WATCH, no forced trade.
    6) Research context (non-prescriptive) + Sources https lines + gaps/funding.
    Host attaches the candlestick chart (and trade_position overlay when a clear HC pick exists).

    Thorough reports welcome (~64KiB KeyGen limit). Post as a KeyGen REPLY via send_key_gen_message. Do not post task dispatches, progress-only updates, or mpc-orchestrate-task blocks.

