# trade-cron.yaml — node-wide defaults for scheduled trade analysis cron runs
#
# Applied on every cron turn when the job message does NOT embed fenced
# `tradeConsensus:` / `tradeBuild:` YAML blocks (message blocks override this file).
# Edit on the node under agent_llm_config/cron/trade-cron.yaml (Cron tab → Trade cron,
# or POST /upsertCronTradeConfig).
#
# Related config (not duplicated here):
#   • trade-desk.yaml — interactive Build Trade prefill fast path
#   • Skills/trade-defaults.md — LLM policy fallback
#   • cron/trade_analysis_cron.example.md — full analysis + selection prose template

version: 1

# Consensus gate before submit_trade_from_consensus (see trade_analysis_cron.example.md).
tradeConsensus:
  requiredSources: [chart_pattern, momentum]
  minAgree: 2
  minConfidence: 0.45
  allowPartial: false
  blockOnConflict: true
  submitTradeFromConsensus: true

# Build/submit defaults when cron selects a clear trade idea.
tradeBuild:
  protocolId: hyperliquid
  chainId: 999
  szHuman: "0.5"
  marketKind: perp
  tif: gtc
  entryProximityMode: price
  entryProximityPct: 1
  entryProximityAtrPeriod: 14
  entryOffsetPct: 1
  invalidationOffsetPct: 1
  useCustomGas: false
  purposeText: Generated by cron.
  # Optional multisign expiry (omit for DeFi 30-minute default):
  # expiryMinutesFromNow: 60
