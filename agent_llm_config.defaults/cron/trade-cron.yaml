# trade-cron.yaml — node-wide defaults for scheduled trade analysis cron runs
#
# Applied on every cron turn when the job message does NOT embed fenced
# `tradeConsensus:` / `tradeBuild:` YAML blocks (message blocks override this file).
# Edit on the node under agent_llm_config/cron/trade-cron.yaml (Cron tab → Trade cron,
# or POST /upsertCronTradeConfig).
#
# Related config (not duplicated here):
#   • trade-desk.yaml — entryProximity*, offsets for analyze_* and Build Trade fast path
#   • Skills/trade-defaults.md — LLM policy fallback (break+retest, fib regime, etc.)
#   • cron/trade_analysis_cron.example.md — full analysis steps + selection prose template

version: 1  # Schema version (must be 1 today).

# ---------------------------------------------------------------------------
# tradeConsensus — machine gate before submit_trade_from_consensus
# ---------------------------------------------------------------------------
# Evaluates persisted trade ideas after analyze_* runs. When gate is ALLOWED and
# submitTradeFromConsensus is true, the agent should call submit_trade_from_consensus
# with a tradeIdeaId matching your cron job's selection prose.
#
# Set submitTradeFromConsensus: false (or omit) for hint-only — injects the matrix
# without requiring submit_trade_from_consensus.

tradeConsensus:
  # Analysis types that must appear in the session AND pass filters below.
  # Values match upserted idea source.analysisType (lowercase snake_case):
  #   chart_pattern | momentum | trend_structure | key_levels |
  #   key_level_fibonacci | bollinger_bands | moving_averages
  # Omit or use [] to consider all analysis types (still subject to minAgree/filters).
  requiredSources: [chart_pattern, momentum]

  # Minimum count of ideas that pass all filters (status, confidence, completeness).
  # Raise when you add more requiredSources (e.g. 3 when requiring three distinct types).
  minAgree: 2

  # Ideas below this confidence are excluded. Scale 0–1 (default 0.45 when omitted in message fences).
  minConfidence: 0.45

  # When false, only ideas with completeness: full count toward minAgree.
  # When true (default if omitted), partial setups may count.
  allowPartial: false

  # When true (default if omitted), BLOCK if consensus candidates mix long and short sides.
  blockOnConflict: true

  # When true, cron guidance requires submit_trade_from_consensus after ALLOWED gate.
  # When false, consensus matrix is informational only (no forced submit tool call).
  submitTradeFromConsensus: true

# ---------------------------------------------------------------------------
# tradeBuild — sizing and build-form defaults after a trade idea is selected
# ---------------------------------------------------------------------------
# Used when the agent calls build_trade_from_* or submit_trade_from_consensus.
# Set protocolId and the sizing fields for that venue. Offsets below are PRICE %
# at build time (see trade-desk.yaml § "Percentage types" for proximity during analyze_*).
#
# Optional tradeIdeaNumber — pin menu index #N (from list_trade_ideas) to skip LLM
# selection when you already know which idea this cron should build.

tradeBuild:
  # Execution venue (lowercase): hyperliquid | arcus | gmx | uniswap
  protocolId: hyperliquid

  # EVM / HL / Arcus chain id. Typical: Hyperliquid 999 (mainnet) / 998 (testnet);
  # Arcus (Robinhood Chain) 4663; GMX & Uniswap on Arbitrum 42161 — confirm via protocol supported-chains.
  chainId: 999

  # --- Hyperliquid sizing (protocolId: hyperliquid) ---
  # Coin size as decimal string (e.g. ETH units). Required for HL build.
  szHuman: "0.5"

  # perp | spot — Hyperliquid market kind (default perp for trend/limit-style ideas).
  marketKind: perp

  # Time-in-force for HL limit orders: gtc | ioc | alo
  tif: gtc

  # --- GMX sizing (uncomment when protocolId: gmx) ---
  # sizeUsdHuman: "500"
  # collateralToken: USDC
  # collateralAmountHuman: "100"

  # --- Uniswap V4 spot (uncomment when protocolId: uniswap) ---
  # Proximity-gated ideas only — no resting limit at structure levels.
  # sizeUsdHuman: "500"

  # --- Arcus perp (uncomment when protocolId: arcus) ---
  # chainId: 4663
  # szHuman: "0.5"
  # marketKind: perp
  # tif: gtc
  # ed25519KeyGenId: "<paired ed25519 KeyGen id — same GroupId as keyGenId>"

  # --- Arcus spot RFQ (uncomment when protocolId: arcus, marketKind: spot) ---
  # chainId: 4663
  # szHuman: "10"
  # marketKind: spot
  # ed25519KeyGenId: "<paired ed25519 KeyGen id>"

  # PRICE % — resting limit band at build (see trade-desk.yaml §3). Typical 0.5–2.
  entryOffsetPct: 1

  # PRICE % — widens invalidation level in purpose text. Typical 0.5–2.
  invalidationOffsetPct: 1

  # Hyperliquid bracket (when idea has target / invalidation) — optional overrides:
  # targetOffsetPct: 0.1        # conservative TP inside target (0 = exact target)
  # targetOffsetMode: price      # price | atr
  # tpslExecMode: limit_at_trigger   # or market

  # EVM protocols (gmx, uniswap): when true, Build Trade sends useCustomGas. Usually false.
  useCustomGas: false

  # Suffix appended to auto-generated purposeText (256 char total limit).
  # Must not contain | or = characters.
  purposeText: Generated by cron.

  # Optional — pin a specific trade idea after a dry-run (menu # from list_trade_ideas):
  # tradeIdeaNumber: 1

  # Optional multisign expiry — omit for DeFi 30-minute default:
  # expiryMinutesFromNow: 60   # minutes from build/prefill time
  # expiryDate: 1735689600     # unix seconds (alternative to expiryMinutesFromNow)

# ---------------------------------------------------------------------------
# Examples (commented — copy into tradeConsensus / tradeBuild to try alternatives)
# ---------------------------------------------------------------------------
#
# Trend + momentum gate (perp cron):
#   tradeConsensus:
#     requiredSources: [trend_structure, momentum]
#     minAgree: 2
#     minConfidence: 0.45
#     allowPartial: false
#     blockOnConflict: true
#     submitTradeFromConsensus: true
#
# Fib + momentum gate:
#   tradeConsensus:
#     requiredSources: [key_level_fibonacci, momentum]
#     minAgree: 2
#
# GMX perp build block:
#   tradeBuild:
#     protocolId: gmx
#     chainId: 42161
#     sizeUsdHuman: "500"
#     collateralToken: USDC
#     collateralAmountHuman: "100"
#     entryOffsetPct: 1
#     invalidationOffsetPct: 1
#     useCustomGas: false
#     purposeText: Generated by cron.
#
# Arcus perp build block (Robinhood Chain 4663):
#   tradeBuild:
#     protocolId: arcus
#     chainId: 4663
#     szHuman: "0.5"
#     marketKind: perp
#     tif: gtc
#     ed25519KeyGenId: "<paired ed25519 KeyGen — same GroupId as keyGenId>"
#     entryOffsetPct: 1
#     invalidationOffsetPct: 1
#     purposeText: Generated by cron.
