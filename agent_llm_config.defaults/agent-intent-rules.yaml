# Host policy: free-text intent → Continuum pack boost + optional system hint + MCP auto-load.
# Never short-circuits the LLM. Structured UI / Telegram callbacks stay hardwired in code.
# Orchestration hook turns ignore rules whose modes omit "hook".
# mpc-auth only matches/loads; vendor and protocol names belong here, not in Go.
version: 1

rules:
  - id: continuum_tool_discovery
    always: true
    hint: |
      Continuum tools are named continuum__<tool_name> — always use that prefix for tools/call.
      If a tool you need isn't listed yet, call continuum__search_continuum_tools with your query,
      then continuum__activate_tool_group on the returned group id; the host expands LLM tools from
      search hits. Brand names alone (e.g. Hyperliquid, Uniswap, Aave, Morpho, GMX) are ambiguous:
      "add/configure chain" or "RPC/network" → registry_chains (add_to_chain_registry);
      trading/swaps/perps/DeFi protocol tools → search/activate defi_discovery then
      continuum__load_defi_protocol — do not load a DeFi protocol merely because a chain brand
      was mentioned.
      Live CTM circulating/escrowed/total supply, veCTM locks, or CTM protocol addresses are not
      in the White Paper. Call continuum__resolve_catalog_mcp_enablement
      { toolset: "continuumdao-tokenomics" } (not list_mcp_servers catalog), then follow
      enable.addFromCatalog / agentLoadMcpServer and get_ctm_metrics.
      On the first assistant reply of a new conversation only, call
      continuum__resolve_catalog_mcp_enablement { toolset: "agent-defaults" } and include
      firstReplyHint if it is a non-empty string (one sentence). If firstReplyHint is null
      (including when AGENT_CHAT_SETUP_HINTS is off), say nothing about defaults.
      Do not list recommended catalog MCPs unless the operator asked what to add.
    modes: [interactive, cron]

  - id: third_party_market_data_consent
    always: true
    hint: |
      Never auto-load market-data MCP servers (coingecko, coingecko-pro, coinbase, coinmarketcap,
      coinmarketcap-public, binance, coinglass, etf-flow, nansen, cryptorank, etc.) without asking the operator first. Prefer
      agent_load_mcp_server after they name a source. DeFi OHLCV on Continuum uses
      continuum__load_defi_protocol, not a third-party market-data MCP.
    modes: [interactive, cron]

  - id: chart_analysis_catalog
    tier: light
    match:
      anySubstring:
        - analysis options
        - what analysis
        - list analysis
        - show analysis
        - analysis menu
        - analysis catalog
    boostGroups: [chart:core]
    hint: |
      Operator asked for the analysis catalog; prefer list_chart_analysis_options when OHLCV is
      bound in this conversation, then wait for a menu pick (host emits analysis_menu SSE).
      Do not activate chart:analyze or run every analyze_* tool.
    modes: [interactive, cron]

  - id: chart_customization_catalog
    match:
      anySubstring:
        - customization options
        - indicator options
        - supported indicators
        - which indicators
        - list indicators
    boostGroups: [chart:core]
    hint: |
      Operator asked for chart customization/indicator options; prefer list_chart_customization_options
      then apply_chart_drawings on the existing prepareReplay.
    modes: [interactive, cron]

  # First-time plot (not "add ema" / "clean chart"). Host regex still gates auto-prepare;
  # this rule is the budget: work → interactive rounds so fetch + prepare can finish.
  - id: chart_render
    tier: work
    match:
      anySubstring:
        - chart the
        - chart a
        - chart an
        - chart this
        - chart my
        - "chart it"
        - chart that
        - chart btc
        - chart eth
        - plot the
        - plot a
        - plot this
        - candlestick chart
        - show chart
        - draw chart
        - prepare_chart
    boostGroups: [chart:core]
    hint: |
      Operator asked to chart/plot/render OHLCV. In this same turn: run the provider fetch_ohlcv
      tool, then continuum__prepare_chart_from_rows with the full fetch as toolResult or
      { title, ohlcvDigest }. Do not call search_continuum_tools or list_tool_groups unless
      those fetch/prepare tools are missing. The node auto-prepares the chart UI after a
      successful fetch when possible.
    modes: [interactive, cron]

  - id: chart_customization_simple
    tier: light
    match:
      anySubstring:
        - add macd
        - add rsi
        - add ema
        - add sma
        - add bollinger
        - add ichimoku
        - add donchian
        - add supertrend
        - remove macd
        - remove rsi
        - remove ema
        - remove sma
        - remove bollinger
        - remove ichimoku
        - remove donchian
        - remove supertrend
    boostGroups: [chart:core]
    hint: |
      Operator asked to add/remove a common indicator; use apply_chart_drawings on the bound chart session
      (do not prepare a fresh chart unless none exists).
    modes: [interactive, cron]

  - id: foundry_compose_import
    tier: work
    match:
      anySubstring:
        - foundry
        - forge script
        - forge import
        - foundry import
        - import from foundry
        - compose import
        - run-latest
    boostGroups: [mpc_compose]
    hint: |
      Foundry / Compose import: if foundry__* tools are absent, call
      continuum__resolve_catalog_mcp_enablement { toolset: "continuum-dao-compose" } or continue
      with native forge in user_folder. Dry-run with --rpc-url and --sender =
      KeyGen ethereumaddress; no --broadcast. Call continuum__import_forge_dry_run_multi_sign_request
      (not create_forge_multi_sign_request) with dryRunFilePath under evm/broadcast/ or
      .mcp-foundry-workspace/broadcast/. Default useCustomGas false unless the operator asked for
      custom gas. Report requestId; do not mark the import complete without it.
    modes: [interactive, cron]

  - id: continuum_dao_compose_proposal
    tier: work
    verify: interview
    boostGroups: ["defi:continuum-dao:governance-write"]
    match:
      anySubstring:
        - compose proposal
        - compose a proposal
        - draft a proposal
        - draft proposal
        - create a draft
        - create a draft proposal
        - draft continuumdao
        - draft continuum dao
        - write a proposal
        - write a new proposal
        - write a new continuumdao
        - new continuumdao proposal
        - simulate proposal
        - simulate the proposal
        - proposal draft
        - create a proposal
        - create a dao proposal
        - help me draft
        - help drafting
    hint: |
      ContinuumDAO compose/simulate: call continuum__resolve_catalog_mcp_enablement
      { toolset: "continuum-dao-compose" } (not list_mcp_servers catalog). If availability
      is repository, follow enable.addFromCatalog / agentLoadMcpServer for required etherscan
      then foundry. If availability is missing, use missingHint (update the MPA Wallet code
      in the Maintenance section) — do not say pull mpc-config.
      Load skill continuum-dao-compose-proposal. Interview first (KeyGen submit vs other-address
      draft, then type, then per-action address + function). Stopping to ask is a complete turn
      — do not invent type, actions, amounts, or an EOA. Do not open, grep, or reuse
      data/proposals/ or any prior workspace draft unless the operator named that file or asked
      to resume it. Do not fetch KeyGen voting power or treat proposalThreshold as the task
      until they choose KeyGen submit. Fetch ABI with etherscan__get_contract_abi (chainid 59144
      or 59141). Sequential execute dry-run is foundry__forge_script: write foundry.files with
      foundry__create_solidity_file, then foundry__forge_script on a Linea fork with no
      --broadcast. Isolated eth_call or cast call cannot carry state. Never broadcast these scripts.
    modes: [interactive]

  # Live CTM figures (not White Paper narrative). Do not use loadMcpServers until the
  # operator has added catalog id continuumdao-tokenomics — missing active servers fail the turn.
  - id: continuum_dao_tokenomics
    tier: light
    match:
      anySubstring:
        - circulating supply
        - circulating ctm
        - ctm circulating
        - tokenomics
        - vectm
        - ve ctm
        - ve-ctm
        - locked ctm
        - escrowed ctm
        - ctm supply
        - ctm metrics
        - how much ctm
        - total supply of ctm
        - ctm protocol address
        - ctm treasury
    hint: |
      Live ContinuumDAO tokenomics (this turn): do not answer circulating/escrowed/total supply,
      veCTM locks, or protocol addresses from search_continuum_docs / the White Paper.
      White Paper “all locked” is narrative; live circulatingSupply is unlocked-outside-treasury
      from app-api. Load skill continuum-dao-tokenomics if present (add_skill_from_catalog first
      if needed). Call continuum__resolve_catalog_mcp_enablement
      { toolset: "continuumdao-tokenomics" } — do not list_mcp_servers scope catalog.
      Required server: if availability is repository, follow enable.addFromCatalog (operator signs)
      then agent_load_mcp_server, then get_ctm_metrics. If availability is missing, use missingHint
      (update the MPA Wallet code in the Maintenance section) — do not say pull mpc-config.
      Desirable etherscan has askOperator true — do not auto-load.
      The skill is not the MCP.
    boostGroups: [agent_mcp_servers, discovery]
    modes: [interactive, cron]

  - id: rss_feed_more_items
    tier: light
    match:
      anySubstring:
        - get more items
        - more items
        - more headlines
        - show more headlines
        - fetch more headlines
    hint: |
      Follow-up: the operator wants more RSS headlines from the prior fetch in this thread.
      Re-call the RSS tool already used (world-affairs__get_world_affairs_latest,
      business-latest__get_business_latest, crypto-latest__get_crypto_latest,
      or coin-bureau-newsletters__get_coin_bureau_latest,
      or crypto-banter-newsletters__get_crypto_banter_latest,
      or crypto-security__get_crypto_security_latest)
      with limit: 25 (max). Keep the same sourceId if
      the prior call filtered by source. Do not use agent_bash, agent_read_file, or agent_grep
      to inspect MCP source — pagination is the limit parameter. For agent_bash mutating commands,
      cwd must be a workspace subtree (data/, skills/, evm/, …) — omitting cwd defaults to
      user_folder root and fails.
    modes: [interactive, cron]

  - id: workspace_script
    tier: work
    match:
      anySubstring:
        - write a script
        - create a script
        - bash script
        - under skills/
        - scripts/
    boostGroups: [agent_workspace]
    hint: |
      Interactive workspace: write scripts under skills/<name>/scripts/ or scripts/; document in the skill
      body or scripts/README.md. Run with agent_bash cwd set to the subtree (skills/, scripts/, data/, …).
    modes: [interactive, cron]

  - id: evm_forge
    tier: work
    match:
      anySubstring:
        - solidity
        - foundry script
        - forge script
        - under evm/
        - evm/src
    boostGroups: [mpc_compose]
    hint: |
      Foundry/Solidity work belongs under evm/ (foundry.toml seeded). Run forge with cwd: evm/.
      Dry-run imports via continuum__import_forge_dry_run_multi_sign_request — no --broadcast.
    modes: [interactive, cron]

  - id: credits_status
    tier: light
    match:
      anySubstring:
        - how many free
        - signature credit
        - signature credits
        - out of credit
        - free signatures
    hint: |
      Operator asked about remaining signature/free credits. Answer from node/keygen status
      tools already available (e.g. get_mpa_wallet_status). Do not spawn research or write tools.
    modes: [interactive, cron]

  - id: analysis_menu_pick
    tier: light
    match:
      anySubstring:
        - run analysis #
        - analysis #
        - do analysis #
    boostGroups: [chart:core]
    hint: |
      Operator picked an analysis menu number. The host auto-runs that analyze_* tool on the
      bound OHLCV session. Do not search or activate extra packs; do not re-list the catalog
      unless the pick failed.
    modes: [interactive, cron]

  - id: list_backups
    tier: light
    match:
      anySubstring:
        - list backups
        - show database backups
        - list database backups
        - show backups
    boostGroups: [node_database:backup]
    hint: |
      Read-only backup listing: call list_database_backups. Do not restore, delete keys, or
      upload/download unless the operator explicitly asked.
    modes: [interactive, cron]

  - id: node_health
    tier: light
    match:
      anySubstring:
        - node status
        - node health
        - is the node online
        - connectivity health
    boostGroups: [node_info]
    hint: |
      Operator asked whether the node is up. Prefer get_health / get_connectivity_health / node_id.
      Do not start backup, restore, or research.
    modes: [interactive, cron]

  - id: pending_signs
    tier: light
    match:
      anySubstring:
        - pending sign requests
        - list sign requests
        - awaiting join
        - signs awaiting join
    boostGroups: [mpc_read]
    hint: |
      Read-only MultiSign listing: list_sign_requests or list_sign_requests_awaiting_join.
      Do not agree, trigger, or broadcast unless the operator explicitly asked.
    modes: [interactive, cron]

  - id: preferred_keygen
    tier: light
    match:
      anySubstring:
        - preferred keygen
        - "what's my keygen"
        - what is my keygen
        - my preferred keygen
    boostGroups: [keygen]
    hint: |
      Operator asked for the preferred KeyGen. Call get_preferred_key_gen. Do not create or
      accept a new keygen request unless they asked.
    modes: [interactive, cron]

  - id: clean_chart
    tier: light
    match:
      anySubstring:
        - clean chart
        - remove overlays
        - clear drawings
        - remove all overlays
    boostGroups: [chart:core, chart:drawings]
    hint: |
      Operator asked to clear chart overlays. Use apply_chart_drawings / remove-drawing tools on
      the bound prepareReplay. Do not fetch new OHLCV or prepare a fresh chart.
    modes: [interactive, cron]

  - id: data_organize
    tier: work
    match:
      anySubstring:
        - organize data
        - data/artifacts
        - data/exports
        - move files under data
        - sort exports
    boostGroups: [agent_workspace]
    hint: |
      Data organization uses user_folder/data/ subtrees. Use agent_ls/agent_glob to inspect, then
      agent_bash with cwd: data/… for moves/transforms. Do not write loose files at user_folder root.
    modes: [interactive, cron]

  - id: block_explorer_ambiguous
    tier: light
    match:
      anySubstring:
        - "transaction hash"
        - "tx hash"
        - "block explorer"
    hint: |
      Explorer lookup without a clear host in the message: resolve chain first (URL hostname,
      chain name or chainId from the node registry, or ask the operator). Then call
      continuum__resolve_catalog_mcp_enablement { toolset: "block-explorer" } and pick one family.
      Etherscan-family explorers
      (etherscan.io, basescan, arbiscan, polygonscan, …) → add/load etherscan
      (only official data MCP is https://mcp.etherscan.io/mcp; ETHERSCAN_API_KEY; chainid parameter).
      Blockscout-hosted chains (*.blockscout.com) → add/load blockscout
      (BLOCKSCOUT_PRO_API_KEY; get_chains_list to resolve chain_id). Do not assume Etherscan.
      Community stdio etherscan-community is unofficial — only if the operator prefers it over official.
      Do not use agent_fetch_url on explorer HTML or agent_bash to scrape pages.
    modes: [interactive, cron]

  - id: block_explorer_etherscan
    tier: light
    match:
      anySubstring:
        - "lineascan"
        - "etherscan.io"
        - "basescan"
        - "arbiscan"
        - "polygonscan"
        - "bscscan"
        - "optimistic.etherscan"
        - "snowtrace"
        - "ftmscan"
        - "mantlescan"
    hint: |
      Block explorer / on-chain transaction on Etherscan-family explorers (etherscan.io, basescan,
      arbiscan, polygonscan, bscscan, lineascan, snowtrace, …): call
      continuum__resolve_catalog_mcp_enablement { toolset: "block-explorer" } then add/load
      official Etherscan MCP
      https://mcp.etherscan.io/mcp (ETHERSCAN_API_KEY, default Bearer). One key covers 60+ chains via
      chainid. Prefer get_transaction_by_hash and get_transaction_receipt; other official tools include
      get_native_balance, get_token_balances, get_transactions, get_token_transfers, get_contract_abi,
      get_gas_oracle. get_address_labels is Pro. For *.blockscout.com use blockscout MCP instead.
      Community stdio (etherscan-community) is unofficial — only if the operator chose it over official.
      Do not scrape explorer HTML. Common chainids: Ethereum=1,
      Sepolia=11155111, Hoodi=560048, BSC=56, BSC testnet=97, Polygon=137, Polygon Amoy=80002,
      Base=8453, Base Sepolia=84532, Arbitrum=42161, Arbitrum Sepolia=421614, Linea=59144,
      Linea Sepolia=59141, OP=10, OP Sepolia=11155420, Avalanche=43114, Fuji=43113, Blast=81457,
      Blast Sepolia=168587773, Gnosis=100, Mantle=5000, Mantle Sepolia=5003, Taiko=167000, Sonic=146,
      Unichain=130, Abstract=2741, Berachain=80094, Monad=143, Sei=1329, World=480, ApeChain=33139,
      and others — full list at https://docs.etherscan.io/supported-chains
    modes: [interactive, cron]

  - id: block_explorer_blockscout
    tier: light
    match:
      anySubstring:
        - "blockscout.com"
        - "blockscout"
        - "soneium-minato.blockscout"
        - "rootstock.blockscout"
        - "ink.blockscout"
        - "bob.blockscout"
        - "plume.blockscout"
        - "unreal.blockscout"
        - "robinhoodchain.blockscout"
        - "worldchain.blockscout"
        - "lightlink.blockscout"
    hint: |
      Block explorer / on-chain data on Blockscout-hosted chains: call
      continuum__resolve_catalog_mcp_enablement { toolset: "block-explorer" } then add/load
      Blockscout MCP (official
      https://mcp.blockscout.com/mcp; needs BLOCKSCOUT_PRO_API_KEY). One PRO API key covers all
      eligible Blockscout PRO gateway chains — call get_chains_list (narrow query by chain name or
      ecosystem) to resolve chain_id before other tools. Session start: __unlock_blockchain_analysis__
      once, then prefer get_transaction_info, get_address_info, get_tokens_by_address, and
      inspect_contract_code. Do not use agent_fetch_url on explorer HTML or agent_bash to scrape pages.
      Do not use Etherscan MCP for *.blockscout.com URLs. Key signup: https://dev.blockscout.com
    modes: [interactive, cron]

  - id: dune_onchain_analytics
    match:
      anySubstring:
        - dune
        - dune analytics
        - dune query
        - on-chain analytics
        - sql analytics
    hint: |
      On-chain analytics via Dune MCP: call continuum__resolve_catalog_mcp_enablement
      { toolset: "dune-analytics" } then add/load dune (needs DUNE_API_KEY). Do not scrape
      dune.com with agent_fetch_url. Continuum DeFi protocol tools are not a substitute for Dune SQL.
    modes: [interactive, cron]

  - id: sec_filings_edgar
    match:
      anySubstring:
        - sec filing
        - sec filings
        - 10-k
        - 10-q
        - edgar
        - edgartools
    hint: |
      SEC EDGAR filings: call continuum__resolve_catalog_mcp_enablement { toolset: "sec-filings" }
      then add/load edgartools. Do not scrape sec.gov HTML.
    modes: [interactive, cron]

  - id: crypto_latest_rss
    match:
      anySubstring:
        - crypto news
        - cryptocurrency news
        - bitcoin news
        - ethereum news
        - crypto headlines
        - crypto rss
        - crypto-latest
        - coindesk
        - cointelegraph
        - bitcoin magazine
        - the defiant
        - blockworks
        - cryptoslate
        - crypto slate
        - good morning crypto
        - openzeppelin
        - open zeppelin
    hint: |
      Crypto headlines: catalog MCP crypto-latest (serverId exact) — keyless RSS
      on continuum-mcp (CoinDesk, The Block, Cointelegraph, Decrypt, Blockworks,
      The Defiant, Bitcoin Magazine, Crypto Potato, CryptoSlate, Good Morning
      Crypto, OpenZeppelin). Do not auto-load. If already active,
      agent_load_mcp_server then get_crypto_latest / search_crypto_latest. If it
      is only in the catalog, tell the operator to Add from repository. Do not
      scrape those sites. Prefer this over catalog **cryptopanic** unless the
      operator named CryptoPanic and has Variables set. For Coin Bureau weekly
      newsletters use **coin-bureau-newsletters**. For Crypto Banter / The
      Insider / The Daily Candle use **crypto-banter-newsletters**. Good Morning
      Crypto is in both: headlines via **crypto-latest** (`sourceId`
      `good-morning-crypto`) or the Banter newsletter MCP. For hack analyses
      / QuillAudits / SlowMist / Immunefi / BlockSec / CertiK / Rekt /
      Trail of Bits use **crypto-security**.
      Not an
      OHLCV chart source.
    modes: [interactive, cron]

  - id: crypto_security_rss
    match:
      anySubstring:
        - crypto security
        - crypto-security
        - hack analysis
        - exploit postmortem
        - smart contract exploit
        - quillaudits
        - quill audits
        - slowmist
        - immunefi
        - blocksec
        - block sec
        - certik
        - rekt
        - rekt.news
        - trail of bits
        - trailofbits
        - trail-of-bits
    hint: |
      Crypto security write-ups: catalog MCP crypto-security (serverId exact)
      — keyless RSS on continuum-mcp (QuillAudits Medium author feed, SlowMist,
      Immunefi, BlockSec, CertiK Medium author feed, Rekt, Trail of Bits).
      Do not auto-load. If already active,
      agent_load_mcp_server then get_crypto_security_latest /
      search_crypto_security. Optional sourceId: quillaudits, slowmist,
      immunefi, blocksec, certik, rekt, trail-of-bits. If it is only in the
      catalog, tell the operator to Add from repository. Do not scrape Medium,
      CoinMonks, quillaudits.com, certik.com, or rekt.news HTML yourself. Do
      not use the mixed CoinMonks publication feed. Not crypto-latest
      (news-wire headlines). Not QuillShield paid audits. Not an OHLCV
      chart source.
    modes: [interactive, cron]

  - id: coin_bureau_newsletters
    match:
      anySubstring:
        - coin bureau
        - coinbureau
        - coin bureau newsletter
        - coinbureau newsletter
    hint: |
      Coin Bureau weekly newsletters: catalog MCP coin-bureau-newsletters
      (serverId exact) — keyless archive + sitemap on continuum-mcp (no public
      RSS). Do not auto-load. If already active, agent_load_mcp_server then
      get_coin_bureau_latest / search_coin_bureau_newsletters. If it is only
      in the catalog, tell the operator to Add from repository. Do not scrape
      coinbureau.com HTML yourself. Not crypto-latest (RSS headlines). Not
      CryptoPanic. Not an OHLCV chart source.
    modes: [interactive, cron]

  - id: crypto_banter_newsletters
    match:
      anySubstring:
        - crypto banter
        - cryptobanter
        - the insider
        - theinsiderletter
        - good morning crypto
        - the daily candle
        - daily candle
    hint: |
      Crypto Banter newsletters: catalog MCP crypto-banter-newsletters
      (serverId exact) — keyless Substack RSS on continuum-mcp (The Insider,
      Good Morning Crypto, The Daily Candle). Do not auto-load. If already
      active, agent_load_mcp_server then get_crypto_banter_latest /
      search_crypto_banter_newsletters. Optional sourceId: the-insider,
      good-morning-crypto, the-daily-candle. If it is only in the catalog,
      tell the operator to Add from repository. Do not scrape cryptobanter.com
      or the Substack HTML yourself. Good Morning Crypto headlines are also in
      **crypto-latest** (`sourceId` `good-morning-crypto`). Not Coin Bureau.
      Not CryptoPanic. Not an OHLCV chart source.
    modes: [interactive, cron]

  - id: cryptopanic_community
    match:
      anySubstring:
        - cryptopanic
        - crypto panic
    hint: |
      CryptoPanic: no official MCP (REST only). Catalog MCP **cryptopanic** is the
      kukapay community wrapper (serverId exact) — tool get_crypto_news. Needs
      Variables CRYPTOPANIC_API_KEY and CRYPTOPANIC_API_PLAN (plan slug in the
      REST path; free developer plan was discontinued). Do not auto-load. If
      already active, agent_load_mcp_server then get_crypto_news. If only in the
      catalog, tell the operator to Add from repository and set both Variables.
      For keyless crypto headlines use **crypto-latest**. Do not scrape
      cryptopanic.com. Not an OHLCV chart source.
    modes: [interactive, cron]

  - id: arkham_intel_api
    match:
      anySubstring:
        - arkham
        - arkham intel
        - arkham intelligence
        - arkm.com
        - intel.arkm
    hint: |
      Arkham Intel API: catalog MCP arkham-intel (serverId exact) — official
      REST at api.arkm.com wrapped as MCP (no hosted Arkham MCP). Needs
      Variable ARKHAM_API_KEY (header API-Key; request access at arkm.com/api).
      Do not auto-load. If already active, agent_load_mcp_server then
      list_arkham_api_paths / arkham_api_request. If only in the catalog, tell
      the operator to Add from repository and set ARKHAM_API_KEY. Do not scrape
      intel.arkm.com. Do not invent undocumented paths — use list_arkham_api_paths
      or arkm.com/llms.txt. /transfers is billed per row. Not an OHLCV chart source.
    modes: [interactive, cron]

  - id: etf_flow_coinglass
    match:
      anySubstring:
        - etf flow
        - etf inflows
        - etf outflows
        - bitcoin etf
        - ethereum etf
        - btc etf
        - eth etf
        - spot etf
        - coinglass
    hint: |
      CoinGlass data: prefer official catalog MCP **coinglass** (serverId exact;
      hosted `https://api-mcp.coinglass.com/mcp`) for funding, open interest,
