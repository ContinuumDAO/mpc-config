# Default ContinuumDAO votePolicy.
# Edit via Skills tab → Host YAML configs, or POST /upsertHostYamlConfig
# with kind=continuum-dao-vote-policy. The vote-policy skill loads this
# installed file (not the example in SKILL.md).
votePolicy:
  version: 1
  defaultAction: skip          # skip | nota | against | abstain — never "for"
  trustedAction: for           # when proposer is trusted or on the Constitution Committee and no deny/block/scam/red standards fired
  keyGenId: ""                 # KeyGen that casts the vote (not a proposer filter)
  # Node-operator allowlist (starts empty). Admin For still requires a prior Ideas & Suggestions thread.
  trustedProposers: []
  # Committee addresses are NOT here. Fetch Constitution “Committee List” (sectionId committee-list).
  blockedProposers: []
  types:
    block: []                  # e.g. [Admin] — hard skip/against even for trusted/committee proposers
    treasury:
      action: against          # against | nota | skip
      maxValueWei: "0"
  signatures:
    allow: []
    deny: ["transfer(", "approve(", "increaseAllowance(", "setOwner(", "upgradeTo"]
  targets:
    deny: []
    treasuryLike: []
  scam:
    rejectValueToEoa: true
    rejectUnknownTarget: true
    rejectEmptyDescriptionWithActions: true
