# Client node: no MQTT broker (connects to relay). Use this on non-first nodes in configs.yaml nodeAddresses.
# App still mounts mosquitto/config so it can read the CA cert at /mosquitto/config/certs/ca.crt.
services:
  mongodb:
    image: mongo:6.0
    restart: always
    environment:
      # mongo image requires BOTH set to create root user; leave both unset for legacy no-auth (see .env.example).
      # Compose substitutes from the shell environment AND .env — stray exports (e.g. MONGO_INITDB_ROOT_USERNAME only) break startup.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-}
      MONGO_APP_USER: ${MONGO_APP_USER:-mpcauth}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-DistributedAuth}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongodb:/data/db
      # Creates app Mongo user on first-run empty data volume when MONGO_* passwords set (repo .env.example).
      - ./mongodb/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - local-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$MONGO_INITDB_ROOT_PASSWORD" ] && [ -n "$$MONGO_INITDB_ROOT_USERNAME" ]; then mongosh --quiet "mongodb://$$MONGO_INITDB_ROOT_USERNAME:$$MONGO_INITDB_ROOT_PASSWORD@127.0.0.1:27017/admin" --eval "db.adminCommand({ ping: 1 })" >/dev/null; else mongosh --quiet --eval "db.adminCommand({ ping: 1 })" >/dev/null; fi || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  app:
    # Image: default continuumdao/mpc-auth:latest; override with MPC_AUTH_COMPOSE_APP_IMAGE.
    image: ${MPC_AUTH_COMPOSE_APP_IMAGE:-continuumdao/mpc-auth:latest}
    restart: always
    # Paths for pending-update.json / pending-reboot.json must match the bind mount below (see systemd/README.md).
    environment:
      GOLOG_FILE: logs/MPCAuthCore.log
      GOLOG_OUTPUT: file
      MPC_AUTH_DOCKER_PENDING_UPDATE_FILE: /var/lib/mpc-auth-docker/pending-update.json
      MPC_AUTH_PENDING_REBOOT_FILE: /var/lib/mpc-auth-docker/pending-reboot.json
      # Optional: mongodb://user:password@mongodb:27017/DB?authSource=DB (see .env.example). Empty = YAML/default (legacy no-auth compatible).
      MongodbUri: ${MongodbUri:-}
    ports:
      - "127.0.0.1:8080:8080" # Management API — localhost only; SSH tunnel for admin
      - "18080:18080" # Public discovery (PublicDiscoveryPort; DAO app NODE_DISCOVERY_PORT)
      - "18081:18081" # ScannerRelayerPort (signRequest, governance GETs when split)
      - "8443:8443"   # Browser HTTPS (DAO app)
      # Optional: loopback read HTTP (mpc-auth BrowserLoopbackReadHTTP) — same JWT routes without TLS in browser (SSH tunnel).
      # Uncomment when configs.yaml sets BrowserLoopbackReadHTTP.Port (match host port to config, bind loopback only):
      # - "127.0.0.1:8445:8445"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Writable host dir: mpc-auth may write pending-update.json / pending-reboot.json for systemd automation (see systemd/README.md).
      - /var/lib/mpc-auth-docker:/var/lib/mpc-auth-docker
      # Writable so POST /configUpdateImplement can merge planned YAML via ruamel (read-only causes apply failures).
      - ./configs.yaml:/app/configs.yaml
      # mpc-config ruamel merge script (rename-or-copy vs bind-mounted configs.yaml; see README).
      - ./console/apply_planned_configs_ruamel.py:/app/console/apply_planned_configs_ruamel.py:ro
      - ./data/app/logs:/app/logs
      - ./mosquitto/config:/mosquitto/config
      - ./webTLS/config/certs:/webTLS/config/certs
    networks:
      - local-network
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
networks:
  local-network:
    driver: bridge
    attachable: true
