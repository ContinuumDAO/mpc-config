version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongodb:/data/db
    networks:
      - local-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: always
    command: mosquitto -c /mosquitto/config/mosquitto.conf -v
    ports:
      - "8883:8883"   # TLS encrypted (default, required)
      # - "9999:1883"   # Unencrypted (disabled - use mosquitto.conf.no-tls for testing)
      - "9001:9001"   # WebSocket (TLS)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - local-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep mosquitto || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    image: continuumdao/mpc-auth:v1.0
    restart: always
    environment:
      # Configuration can be set via environment variables or configs.yaml file
      # If both are set, environment variables take precedence
      - GOLOG_FILE=logs/MPCAuthCore.log
      - GOLOG_OUTPUT=file
    ports:
      # Management API (ManagementAPIsPort): bound to loopback — use SSH tunnel to host:8080; not exposed on public IP.
      - "127.0.0.1:8080:8080"
      - "18080:18080" # Public discovery GET /getNodeMgtKey (configs.yaml PublicDiscoveryPort; matches NODE_DISCOVERY_PORT on DAO app)
      - "18081:18081" # Scanner/relayer HTTP (configs.yaml ScannerRelayerPort); POST /signRequest etc. when split from 8080
      - "8443:8443"   # Browser HTTPS (DAO app); GET routes use JWT per configs.yaml BrowserHTTPS
      # Optional: loopback read HTTP (mpc-auth BrowserLoopbackReadHTTP) — same JWT routes without TLS in browser (SSH tunnel).
      # Uncomment when configs.yaml sets BrowserLoopbackReadHTTP.Port (match host port to config, bind loopback only):
      # - "127.0.0.1:8445:8445"
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - ./configs.yaml:/app/configs.yaml:ro
      - ./data/app/logs:/app/logs
      - ./mosquitto/config:/mosquitto/config
      - ./webTLS/config/certs:/webTLS/config/certs
    networks:
      - local-network
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
networks:
  local-network:
    driver: bridge
    attachable: true
