name: mpc-chat packages

on:
  workflow_dispatch:
  push:
    tags:
      - "mpc-chat-v*"

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mpc-config
        uses: actions/checkout@v4

      - name: Checkout mpc-auth
        uses: actions/checkout@v4
        with:
          repository: Selqui/mpc-auth
          path: mpc-auth
          token: ${{ secrets.MPC_AUTH_CHECKOUT_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build deb and Arch packages
        env:
          MPC_AUTH_DIR: ${{ github.workspace }}/mpc-auth
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.1.0' }}
        run: ./packaging/mpc-chat/build.sh

      - name: Attach packages to the GitHub release
        if: startsWith(github.ref, 'refs/tags/mpc-chat-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/mpc-chat/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
