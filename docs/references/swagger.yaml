definitions:
  node.APIResponse:
    type: object
    properties:
      code:
        description: 0 succes, 1 error
        type: integer
      data: {}
      error:
        type: string
  node.KeyGenRequestAgreePost:
    type: object
    properties:
      clientPk:
        type: string
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
  node.KeyGenRequestPost:
    type: object
    properties:
      clientPk:
        type: string
      groupId:
        type: string
      keyType:
        type: string
      msgCheck:
        type: string
      nonce:
        type: integer
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
      threshold:
        type: integer
  node.NewGroupRequestAgreePost:
    type: object
    properties:
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
  node.NewGroupRequestPost:
    type: object
    properties:
      BrokerArray:
        type: array
        items:
          type: string
      keyList:
        type: array
        items:
          type: string
      nonce:
        type: integer
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
  node.PresignRequestPost:
    type: object
    properties:
      keyList:
        type: array
        items:
          type: string
      nonce:
        type: integer
      presignAmt:
        type: integer
      pubKey:
        type: string
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
  node.PresinRequestAgreePost:
    type: object
    properties:
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
  node.RelayerRegisterRequest:
    type: object
    required:
    - relayerName
    - relayerPublicKey
    properties:
      allowedChains:
        description: Empty means all chains allowed
        type: array
        items:
          type: string
      metadata:
        type: object
        additionalProperties:
          type: string
      registeredBy:
        type: string
      relayerName:
        type: string
      relayerPublicKey:
        description: Single public key for initial registration
        type: string
  node.RelayerUpdateRequest:
    type: object
    required:
    - publicKeys
    - relayerPublicKey
    - relayerSignature
    properties:
      publicKeys:
        description: New array of public keys (must include at least one)
        type: array
        items:
          type: string
      relayerPublicKey:
        description: Public key used to sign this request
        type: string
      relayerSignature:
        description: Signature of this request
        type: string
  node.SignRequestAgreePost:
    type: object
    properties:
      clientSig:
        type: string
      requestId:
        type: string
      accept:
        type: boolean
      thoughts:
        type: string
      signedMessage:
        type: string
        description: Exact string signed (MetaMask or Ed25519). If JSON, SHOULD include "nodeKey" (128 hex from GET /getNodeKey) so the client signature binds to this node; omitting nodeKey in JSON is deprecated.
      signerAddress:
        type: string
      nodeKey:
        type: string
        description: Optional; when using Ed25519 with an empty signedMessage, include in JSON so canonical signing includes it (see API_IMPLEMENTATION.md). For MetaMask, embed "nodeKey" inside the JSON you place in signedMessage.
  node.SignRequestPost:
    type: object
    properties:
      chainID:
        description: 'Optional: for chain access control'
        type: string
      clientSig:
        description: signed by clientpk saved when keygen
        type: string
      keyList:
        type: array
        items:
          type: string
      msgHash:
        type: string
      msgRaw:
        type: string
      presignId:
        description: presignId of presign, instead of requestId of presign
        type: string
      pubKey:
        type: string
      relayerPublicKey:
        description: Relayer authentication fields
        type: string
      relayerSignature:
        type: string
      sourceChainID:
        description: Chain ID of the source transaction
        type: string
      sourceTxHash:
        description: 'NEW: Source transaction information for pre-signing verification'
        type: string
      destinationChainID:
        description: Destination chain ID (stored and returned in listSignRequests / getSignRequestById)
        type: string
      destinationAddress:
        description: Destination address (stored and returned in listSignRequests / getSignRequestById)
        type: string
      extraJSON:
        description: Arbitrary JSON string for node context (stored and returned in listSignRequests / getSignRequestById)
        type: string
  node.TriggerSignRequestByIdPost:
    type: object
    description: 'POST /triggerSignRequestById. Full semantics: mpc-config docs/references/API_IMPLEMENTATION.md (POST /triggerSignRequestById).'
    properties:
      requestId:
        type: string
        description: Sign request id
      nonce:
        type: integer
        description: Management key nonce (see GET /getNodeMgtKeyNonce)
      sig:
        type: string
        description: Management signature over the JSON body with sig set to empty
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with Nonce/sig so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
      txParams:
        type: object
        description: Single-tx execute params, or batch index 0 when txParamsBatch omitted (see API_IMPLEMENTATION.md)
      txParamsBatch:
        type: array
        items:
          type: object
        description: 'Batch only: length N; merges per index with proposal_tx_params into execute_tx_params (mutually exclusive
          with txParams)'
      messageHash:
        type: string
        description: 'Single-tx: unsigned EVM tx signing hash (hex); local only, not propagated'
      messageHashes:
        type: array
        items:
          type: string
        description: 'Batch only: optional length-N digest list; replaces agreed hashes on originator; empty string at index
          i skips that leg; at least one non-empty required'
      messageRawBatch:
        type: array
        items:
          type: string
        description: 'Batch only: optional; length must match messageHashes when both sent'
  node.PostChainDetailsPost:
    type: object
    description: POST /postChainDetails body. See docs/API_IMPLEMENTATION.md (POST /postChainDetails).
    required:
    - nonce
    - chainName
    - chainId
    - rpcGateway
    - signedMessage
    - clientSig
    properties:
      nonce:
        type: integer
        description: Management key nonce (see GET /getNodeMgtKeyNonce or /getPublicMgtKeyNonce for Ed25519)
      chainName:
        type: string
      chainId:
        description: Chain id (number or string in JSON; stored as string)
        type: string
      rpcGateway:
        type: string
      explorer:
        type: string
        description: Optional blockchain explorer URL (http/https)
      legacy:
        type: boolean
      testnet:
        type: boolean
      gasName:
        type: string
      gasLimit:
        type: number
      baseFee:
        type: number
        description: EIP-1559 base fee (gwei); omit or null to leave unset for client refetch
      priorityFee:
        type: number
        description: EIP-1559 priority fee (gwei); omit or null to leave unset for client refetch
      baseFeeMultiplier:
        type: number
        description: 'EIP-1559: percentage for base component of maxFeePerGas (e.g. 200 = 2× base); should be ≥ 100'
      gasMultiplier:
        type: number
      gasPrice:
        type: number
        description: 'Legacy: gas price in gwei'
      defaultGetSigFeeSpeed:
        type: string
        description: 'Optional. Default Get Sig / Get Sigs fee tier (eth_feeHistory-based): slow, normal, or fast. Omitted
          = leave unset; clients default to normal.'
        enum:
        - slow
        - normal
        - fast
      signedMessage:
        type: string
        description: Exact string signed (MetaMask personal_sign or Ed25519). If you use a JSON payload, include "nodeKey" set to this node's 128-hex MPC public key (GET /getNodeKey) so the signature cannot be replayed on another node; omitting nodeKey in JSON is deprecated. Not applicable when signedMessage is opaque non-JSON (e.g. some MQTT CA flows).
      clientSig:
        type: string
        description: 'MetaMask: 0x-prefixed; Ed25519: 128 hex characters'
  node.LocalChainConfigDoc:
    type: object
    description: Local chain config returned in GET /getChainDetails `data` (one object) or as elements of the array when
      listing all chains.
    properties:
      chainId:
        type: string
      chainName:
        type: string
      rpcGateway:
        type: string
      explorer:
        type: string
      legacy:
        type: boolean
      testnet:
        type: boolean
      gasName:
        type: string
      gasLimit:
        type: number
      baseFee:
        type: number
        description: Optional; may be null if not stored
      priorityFee:
        type: number
        description: Optional; may be null if not stored
      baseFeeMultiplier:
        type: number
      gasMultiplier:
        type: number
      gasPrice:
        type: number
      defaultGetSigFeeSpeed:
        type: string
        description: Optional. slow | normal | fast. Omitted on legacy stored configs; clients default to normal.
        enum:
        - slow
        - normal
        - fast
      updatedAt:
        type: string
        format: date-time
