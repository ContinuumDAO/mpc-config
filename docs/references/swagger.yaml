  /getNodeMgtKeyNonce:
    get:
      consumes:
      - application/json
      description: get nonce of node management key
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      summary: get nonce of node management key
      tags:
      - Node Related Info
  /hasPublicMgtKey:
    get:
      consumes:
      - application/json
      description: returns true if at least one Ed25519 management key is allowed (config PublicMgtKey or keys added via addManagementKey), false otherwise
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      summary: check if public management key is configured
      tags:
      - Node Related Info
  /getPublicMgtKeyNonce:
    get:
      consumes:
      - application/json
      description: returns the current nonce for an Ed25519 management key. Optional query param publicKey (64 hex) selects which key; if omitted, uses config PublicMgtKey.
      produces:
      - application/json
      parameters:
      - description: Ed25519 public key (64 hex). If omitted, uses config PublicMgtKey.
        in: query
        name: publicKey
        required: false
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
        "400":
          description: No key specified or key not allowed
          schema:
            $ref: '#/definitions/node.APIResponse'
      summary: get nonce for public management key (Ed25519)
      tags:
      - Node Related Info
  /addManagementKey:
    post:
      consumes:
      - application/json
      description: Adds a new Ed25519 public key to the allowed set for management API auth. Request must be signed by an existing Ed25519 management key (config PublicMgtKey or a key previously added). Only a permitted machine can add another key.
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          required:
          - newPublicKey
          - sig
          properties:
            newPublicKey:
              type: string
              description: 64 hex (32-byte Ed25519 public key) to add
            nonce:
              type: integer
              description: Current nonce for the signer key (from getPublicMgtKeyNonce)
            sig:
              type: string
              description: Ed25519 signature (128 hex) over canonical JSON of body with sig empty
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
        "400":
          description: Invalid body or no Ed25519 key configured
          schema:
            $ref: '#/definitions/node.APIResponse'
        "401":
          description: Invalid or missing Ed25519 signature
          schema:
            $ref: '#/definitions/node.APIResponse'
      summary: add an additional Ed25519 management public key
      tags:
      - Node Related Info
  /getPingNodesResultById:
    get:
