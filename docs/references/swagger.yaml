swagger: '2.0'
info:
  contact: {}
  title: MPC Auth Management API
  description: Distributed Auth / MPC node HTTP API. All responses use node.APIResponse (code, error, data).
  version: '1.0'
paths:
  /version:
    get:
      description: get node version
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get node version
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNodeMgtKey:
    get:
      description: Returns the configured NodeMgtKey (Ethereum address, 0x + 40 hex) from configs.yaml / NodeMgtKey env. APIResponse
        data is that string. Unauthenticated on the management port and on PublicDiscoveryPort when split. See mpc-config
        docs/references/API_IMPLEMENTATION.md (GET /getNodeMgtKey).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getNodeMgtKey
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPublicMgtKey:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getPublicMgtKey).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getPublicMgtKey
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getAllowedEd25519MgtKeys:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getAllowedEd25519MgtKeys).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getAllowedEd25519MgtKeys
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /health:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /health).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET health
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNodeKey:
    get:
      description: get node key (node id), which is unique for node
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get node key (node id)
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getMachineInfo:
    get:
      description: get node machine info
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get node machine info
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNodeMgtKeyNonce:
    get:
      description: get nonce of node management key
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get nonce of node management key
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /hasPublicMgtKey:
    get:
      description: returns true if at least one Ed25519 management key is allowed (config PublicMgtKey or keys added via addManagementKey),
        false otherwise
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: check if public management key is configured
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPublicMgtKeyNonce:
    get:
      description: returns the current nonce for an Ed25519 management key. Optional query param publicKey (64 hex) selects
        which key; if omitted, uses config PublicMgtKey.
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: query
        name: publicKey
        required: false
        type: string
        description: Ed25519 public key (64 hex). If omitted, uses config PublicMgtKey.
      tags:
      - Node Related Info
      summary: get nonce for public management key (Ed25519)
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
        '400':
          description: No key specified or key not allowed
          schema:
            $ref: '#/definitions/node.APIResponse'
  /verifyMgtKey:
    post:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (POST /verifyMgtKey).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: POST verifyMgtKey
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          description: Request JSON — see in mpc-config repo docs/references/API_IMPLEMENTATION.md
  /addManagementKey:
    post:
      description: Adds a new Ed25519 public key to the allowed set for management API auth. Request must be signed by an
        existing Ed25519 management key (config PublicMgtKey or a key previously added). Only a permitted machine can add
        another key.
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          required:
          - newPublicKey
          - sig
          properties:
            newPublicKey:
              type: string
              description: 64 hex (32-byte Ed25519 public key) to add
            nonce:
              type: integer
              description: Current nonce for the signer key (from getPublicMgtKeyNonce)
            sig:
              type: string
              description: Ed25519 signature (128 hex) over canonical JSON of body with sig empty
      tags:
      - Node Related Info
      summary: add an additional Ed25519 management public key
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
        '400':
          description: Invalid body or no Ed25519 key configured
          schema:
            $ref: '#/definitions/node.APIResponse'
        '401':
          description: Invalid or missing Ed25519 signature
          schema:
            $ref: '#/definitions/node.APIResponse'
  /removeManagementKey:
    post:
