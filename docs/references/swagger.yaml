        chainId:
          type: string
        chainName:
          type: string
        rpcGateway:
          type: string
        endpointKind:
          type: string
          enum:
          - json-rpc
          - horizon
          - ton-http
        explorer:
          type: string
        testnet:
          type: boolean
        nativeSymbol:
          type: string
        nativeDecimals:
          type: integer
        wsGateway:
          type: string
        tonVendor:
          type: string
