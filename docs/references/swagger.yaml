definitions:
  node.APIResponse:
    type: object
    properties:
      code:
        description: 0 succes, 1 error
        type: integer
      data: {}
      error:
        type: string
  node.EffectiveEcdsaMpcProtocol:
    type: string
    description: 'Runtime secp256k1 ECDSA MPC variant: "cggmp24" (default) or "gg18" (legacy Mongo rows only). Empty for Schnorr
      key types. API-only JSON on keygen/sign GET responses.'
  node.KeyGenResultData:
    type: object
    description: Documentary shape for APIResponse.data from GET /getKeyGenResultById when Code=0 (actual payloads also include
      protobuf keygenrequestdatapb, savedata ciphertext, possibly cggmp24aux; optional fields omitted when empty). For secp256k1
      MPC keys with pubkeyhex, ethereumaddress plus bitcoin SegWit v0 P2WPKH strings are recomputed server-side.
    properties:
      requestid:
        type: string
      pubkeyhex:
        type: string
        description: MPC joint pubkey as x‖y uncompressed coordinates, 128 hex characters
      ethereumaddress:
        type: string
        description: EVM-style address derived from pubkeyhex when keytype is secp256k1
      bitcoinp2wpkhmainnet:
        type: string
        description: Bitcoin mainnet native SegWit v0 (P2WPKH) bc1… from pubkeyhex
      bitcoinp2wpkhtestnet:
        type: string
        description: Bitcoin TestNet3 P2WPKH tb1… (chaincfg.TestNet3Params)
      bitcoinp2wpkhsignet:
        type: string
        description: Bitcoin Signet P2WPKH (chaincfg.SigNetParams; witness HRP is tb per btcd — may match bitcoinp2wpkhtestnet
          string for the same pubkey)
      keylist:
        type: array
        items:
          type: string
      globalnonce:
        type: integer
        format: int64
      timepoint:
        type: string
      status:
        type: string
      effectiveEcdsaMpcProtocol:
        $ref: '#/definitions/node.EffectiveEcdsaMpcProtocol'
      keygenresultstatus:
        type: string
        description: When **ejected**, MPC shares are cleared; use POST /getEthereumPrivateKey or POST /getBitcoinPrivateKey
          (secp256k1), POST /getEd25519PrivateKey (ed25519), or POST /getTaprootPrivateKey (bitcoin-taproot) for export on
          this node.
      ejectedat:
        type: string
        description: UTC time when eject finalized (when status is ejected)
      ejectedprivatekey:
        type: string
        description: Omitted or redacted as HIDE ENCRYPTED DATA in list/get unless decrypted internally.
      solanaaddress:
        type: string
        description: Solana address (base58 ed25519 pubkey) when keytype is ed25519
      sorobanaddress:
        type: string
        description: Stellar/Soroban strkey (G…) when keytype is ed25519
      nearaddress:
        type: string
        description: NEAR implicit account (64-char lowercase hex pubkey) when keytype is ed25519
      tonaddress:
        type: string
        description: TON wallet address when keytype is ed25519
      suiaddress:
        type: string
        description: Sui account address (0x + 64 hex; BLAKE2b-256 of 0x00||pubkey) when keytype is ed25519
      bitcoinp2trmainnet:
        type: string
        description: Bitcoin mainnet P2TR bc1p… when keytype is bitcoin-taproot
      taprootinternalpubkeyhex:
        type: string
        description: x-only internal Taproot key P (64 hex) for bitcoin-taproot
      effectiveSchnorrMpcProtocol:
        type: string
        description:
          $ref: '#/definitions/node.EffectiveSchnorrMpcProtocol'
  node.KeyGenRequestAgreePost:
    type: object
    properties:
      clientPk:
        type: string
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig
          so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
  node.KeyGenRequestPost:
    type: object
    properties:
      clientPk:
        type: string
      ecdsaMpcProtocol:
        type: string
        description: Optional. secp256k1 only. Omit or "cggmp24" (default) for CGGMP24 ECDSA DKG/sign. Explicit "gg18" is
          rejected on new keygen (legacy Mongo keys fail closed). Ignored for ed25519 and bitcoin-taproot (FROST via givre).
          Must be in the management-key signed JSON when sent.
      groupId:
        type: string
      keyType:
        type: string
        description: secp256k1 (EVM ECDSA / CGGMP24), ed25519 (FROST Schnorr), or bitcoin-taproot (FROST BIP-340 Taproot key-path).
          FROST key types require a rust-tagged mpc-auth build (-tags rust + givre FFI).
      msgCheck:
        type: string
      nonce:
        type: integer
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig
          so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
      threshold:
        type: integer
        description: 'Signing quorum stored on the keygen payload. secp256k1 (CGGMP24, default): literal quorum t; MPC signing
          needs t parties; require 2 ≤ t ≤ n (n = group size). ed25519 and bitcoin-taproot (FROST / givre): literal quorum
          t; MPC signing needs t parties; require 2 ≤ t ≤ n. Legacy GG18 secp256k1 keys (Mongo only) used polynomial degree
          d with quorum d+1 — new keygen rejects gg18.'
  node.NewGroupRequestAgreePost:
    type: object
    properties:
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
      nodeKey:
        type: string
        description: Optional (recommended). 128-hex MPC node id from GET /getNodeKey — include in the signed JSON with nonce/sig
          so the signature cannot be replayed on another node. Omitting nodeKey is deprecated and may become unsupported.
  node.NewGroupRequestPost:
