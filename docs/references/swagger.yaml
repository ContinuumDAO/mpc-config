      nodeKey:
        type: string
        description: Required. 128-hex MPC node id from GET /getNodeKey
      clientSig:
        type: string
        description: Management signature over json.Marshal body with clientSig and signedMessage cleared
      accept:
        type: boolean
        description: 'Multi-agree only: false = reject; omit or true = agree'
      thoughts:
        type: string
        description: Optional comment; max 256 chars
  node.SignRequestPost:
