swagger: '2.0'
info:
  contact: {}
  title: MPC Auth Management API
  description: Distributed Auth / MPC node HTTP API. All responses use node.APIResponse (code, error, data). Keygen and sign
    GET/list response bodies include effectiveEcdsaMpcProtocol for secp256k1 ("gg18" or "cggmp24"); empty when not applicable.
    For completed secp256k1 keys, GET /getKeyGenResultById data and GET /getAllGroupIds keyGens[] include ethereumaddress
    plus bitcoinp2wpkhmainnet (bc1… mainnet), bitcoinp2wpkhtestnet (Bitcoin TestNet3 tb1…), bitcoinp2wpkhsignet (Bitcoin Signet;
    btcd SigNet witness HRP tb so encoding may duplicate testnet). GET /getGlobalNonceByKeyGenId data map includes effectiveEcdsaMpcProtocol
    (see that path description). See mpc-config docs/references/API_IMPLEMENTATION.md.
  version: '1.0'
paths:
  /version:
    get:
      description: Application version, versionDate, cggmp24UpstreamGitRev, and givreUpstreamGitRev (Lockness git pins when
        built with -tags rust; otherwise empty). See mpc-config docs/references/API_IMPLEMENTATION.md (GET /version).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get node version
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNodeMgtKey:
    get:
      description: Returns the configured NodeMgtKey (Ethereum address, 0x + 40 hex) from configs.yaml / NodeMgtKey env. APIResponse
        data is that string. Unauthenticated on the management port and on PublicDiscoveryPort when split. See mpc-config
        docs/references/API_IMPLEMENTATION.md (GET /getNodeMgtKey).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getNodeMgtKey
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPublicMgtKey:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getPublicMgtKey).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getPublicMgtKey
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getAllowedEd25519MgtKeys:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getAllowedEd25519MgtKeys).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getAllowedEd25519MgtKeys
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPreferredSigner:
    get:
      description: Preferred Ed25519 public key for agent signing when still in the active management allow-list (otherwise
        empty publicKeyHex in Data). Unauthenticated on the management port and on PublicDiscoveryPort when split. See mpc-config
        docs/references/API_IMPLEMENTATION.md (GET /getPreferredSigner).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Agent automation
      summary: GET getPreferredSigner
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPreferredKeyGen:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getPreferredKeyGen).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Agent automation
      summary: GET getPreferredKeyGen
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /health:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /health).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET health
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNodeKey:
    get:
      description: get node key (node id), which is unique for node
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get node key (node id)
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getMachineInfo:
    get:
      description: get node machine info
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get node machine info
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNodeMgtKeyNonce:
    get:
      description: get nonce of node management key
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get nonce of node management key
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /hasPublicMgtKey:
    get:
      description: returns true if at least one Ed25519 management key is allowed (config PublicMgtKey or keys added via addManagementKey),
        false otherwise
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: check if public management key is configured
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPublicMgtKeyNonce:
    get:
      description: returns the current nonce for an Ed25519 management key. Optional query param publicKey (64 hex) selects
        which key; if omitted, uses config PublicMgtKey.
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: query
        name: publicKey
        required: false
        type: string
        description: Ed25519 public key (64 hex). If omitted, uses config PublicMgtKey.
      tags:
      - Node Related Info
      summary: get nonce for public management key (Ed25519)
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
        '400':
          description: No key specified or key not allowed
          schema:
            $ref: '#/definitions/node.APIResponse'
  /verifyMgtKey:
    post:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (POST /verifyMgtKey).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: POST verifyMgtKey
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          description: Request JSON — see in mpc-config repo docs/references/API_IMPLEMENTATION.md
  /addManagementKey:
    post:
      description: 'Generate and register a new Ed25519 management key pair. Full detail: mpc-config docs/references/API_IMPLEMENTATION.md
        (POST /addManagementKey). Schema: #/definitions/node.AddManagementKeyPost.'
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/node.AddManagementKeyPost'
      tags:
      - Node Related Info
      summary: Generate and register a new Ed25519 management key pair
      responses:
        '200':
          description: 'OK (`code`: 0 in APIResponse)'
          schema:
            $ref: '#/definitions/node.APIResponse'
        '400':
          description: Invalid body / nonce / signedMessage mismatch / malformed key
          schema:
            $ref: '#/definitions/node.APIResponse'
        '401':
          description: Invalid Ed25519 or Ethereum management signature
          schema:
            $ref: '#/definitions/node.APIResponse'
  /removeManagementKey:
    post:
      description: 'Soft-remove an added Ed25519 management public key and local key files. Full detail: mpc-config docs/references/API_IMPLEMENTATION.md
        (POST /removeManagementKey). Schema: #/definitions/node.RemoveManagementKeyPost.'
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: Soft-remove an added Ed25519 management public key and local key files
      responses:
        '200':
          description: 'OK (`code`: 0 in APIResponse)'
          schema:
            $ref: '#/definitions/node.APIResponse'
        '400':
          description: Invalid body / nonce / signedMessage mismatch / malformed key
          schema:
            $ref: '#/definitions/node.APIResponse'
        '401':
          description: Invalid Ed25519 or Ethereum management signature
          schema:
            $ref: '#/definitions/node.APIResponse'
        '404':
          description: Target not among added keys (or wrong key type)
          schema:
            $ref: '#/definitions/node.APIResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/node.RemoveManagementKeyPost'
  /getNodeUptime:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getNodeUptime).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getNodeUptime
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getMessageToSign:
    post:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (POST /getMessageToSign).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: POST getMessageToSign
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          description: Request JSON — see in mpc-config repo docs/references/API_IMPLEMENTATION.md
  /getAllowedKeyTypes:
    get:
      description: Returns allowed KeyGen key types from configs.yaml AllowedKeyTypeList (e.g. secp256k1, ed25519, bitcoin-taproot).
        FROST types require mpc-auth built with -tags rust. See mpc-config docs/references/API_IMPLEMENTATION.md GET /getAllowedKeyTypes.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get allowed keytypes of node
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getAllowedMsgCheckTypes:
    get:
      description: get allowed msgcheck types of node
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get allowed msgcheck types of node
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getConfiguredNodeKeys:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getConfiguredNodeKeys).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getConfiguredNodeKeys
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getSubscriptions:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /getSubscriptions).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET getSubscriptions
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /connectivityHealth:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /connectivityHealth).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: GET connectivityHealth
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getSuccessRate:
    get:
      description: get node success rate, including keygen and sign
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get node success rate
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPreSigningVerificationStatus:
    get:
      description: get pre-signing verification configuration and status
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get pre-signing verification status
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getClientSigStatus:
    get:
      description: returns whether client signature verification is ignored (IgnoreClientSigCheck). When true, client signatures
        during MPC coordination are not verified; set false in production.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get client signature check status
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getLogs:
    get:
      description: get logs for a specified number of hours back
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Node Related Info
      summary: get logs
      parameters:
      - type: number
        description: hours
        name: hours
        in: query
        required: false
        default: 12
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /pingNodesRequest:
    get:
      description: 'send ping request to other nodes, note: can input nodekey arrary as parameters'
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Ping Nodes
      summary: send ping request to other nodes
      parameters:
      - type: string
        description: nodekey
        name: nodekey
        in: query
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getPingNodesResultById:
    get:
      description: get pingnodes result by id
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Ping Nodes
      summary: get pingnodes result by id
      parameters:
      - type: string
        description: id
        name: id
        in: query
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /listPingResults:
    get:
      description: list pingnodes result list
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Ping Nodes
      summary: list pingnodes result
      parameters:
      - type: number
        description: pagenum
        name: pagenum
        in: query
      - type: number
        description: pagesize
        name: pagesize
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getInactiveNodes:
    get:
      description: get inactive nodes from ping results over a specified time period, optionally filtered by public key
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Ping Nodes
      summary: get inactive nodes
      parameters:
      - type: number
        description: hours
        name: hours
        in: query
        required: false
        default: 24
      - type: string
        description: pubKey
        name: pubKey
        in: query
        required: false
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /newGroupRequest:
    post:
      description: send newgroup request
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: send newgroup request
      parameters:
      - description: request
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/node.NewGroupRequestPost'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /newGroupRequestRetry:
    post:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (POST /newGroupRequestRetry).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: POST newGroupRequestRetry
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /listNewGroupRequests:
    get:
      description: list newgroup requests
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: list newgroup requests
      parameters:
      - type: string
        description: filter
        name: filter
        in: query
      - type: number
        description: pagenum
        name: pagenum
        in: query
      - type: number
        description: pagesize
        name: pagesize
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNewGroupRequestById:
    get:
      description: get newgroup request by id
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: get newgroup request by id
      parameters:
      - type: string
        description: id
        name: id
        in: query
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /newGroupRequestAgree:
    post:
      description: agree newgroup request
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: agree newgroup request
      parameters:
      - description: request
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/node.NewGroupRequestAgreePost'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getNewGroupResultById:
    get:
      description: 'Deprecated: prefer GET /getGroupResultById. Same semantics as GET /getGroupResultById. See mpc-config
        docs/references/API_IMPLEMENTATION.md (GET /getNewGroupResultById).'
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: GET getNewGroupResultById
      parameters:
      - type: string
        name: id
        in: query
        required: false
        description: Request ID from newGroupRequest response
      - type: string
        name: group_id
        in: query
        required: false
        description: Group ID (deterministic hash of sorted keyList)
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      deprecated: true
  /getGroupResultById:
    get:
      description: Get new-group result by request id (`id`) or `group_id` (exclusive). See mpc-config docs/references/API_IMPLEMENTATION.md
        (GET /getGroupResultById).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: GET getGroupResultById
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      parameters:
      - type: string
        name: id
        in: query
        required: false
        description: Request ID from newGroupRequest response
      - type: string
        name: group_id
        in: query
        required: false
        description: Group ID (deterministic hash of sorted keyList)
  /newSubGroupRequest:
    post:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (POST /newSubGroupRequest).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: POST newSubGroupRequest
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          description: Request JSON — see in mpc-config repo docs/references/API_IMPLEMENTATION.md
  /listNewSubGroupRequests:
    get:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (GET /listNewSubGroupRequests).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: GET listNewSubGroupRequests
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /newSubGroupRequestAgree:
    post:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (POST /newSubGroupRequestAgree).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Nodes Group
      summary: POST newSubGroupRequestAgree
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      parameters:
      - in: body
        name: body
        required: true
        schema:
          type: object
          description: Request JSON — see in mpc-config repo docs/references/API_IMPLEMENTATION.md
  /keyGenRequest:
    post:
      description: send keygen request
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Key Generation
      summary: send keygen request
      parameters:
      - description: request
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/node.KeyGenRequestPost'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /keyGenRequestRetry:
    post:
      description: MPC node management API — see in mpc-config repo docs/references/API_IMPLEMENTATION.md (POST /keyGenRequestRetry).
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Key Generation
      summary: POST keyGenRequestRetry
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /listKeyGenRequests:
    get:
      description: list keygen requests. Each item includes effectiveEcdsaMpcProtocol for secp256k1 (gg18/cggmp24); empty
        otherwise.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Key Generation
      summary: list keygen requests
      parameters:
      - type: string
        description: 'all | pending | success | failed | agree | originator | ejected. Keygen: success=TSS complete (SaveData
          on result row); ejected=key export tombstone (keygenresultstatus); agree=stored agree, no SaveData, not ejected;
          pending excludes agree, success, failed, ejected. See mpc-config docs/references/API_IMPLEMENTATION.md (GET /listKeyGenRequests).'
        name: filter
        in: query
      - type: number
        description: pagenum
        name: pagenum
        in: query
      - type: number
        description: pagesize
        name: pagesize
        in: query
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /getKeyGenRequestById:
    get:
      description: get keygen request by id. Response data includes effectiveEcdsaMpcProtocol for secp256k1 (gg18/cggmp24);
        empty otherwise.
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Key Generation
      summary: get keygen request by id
      parameters:
      - type: string
        description: id
        name: id
        in: query
        required: true
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /keyGenRequestAgree:
    post:
      description: agree keygen request
      consumes:
      - application/json
      produces:
      - application/json
      tags:
      - Key Generation
      summary: agree keygen request
      parameters:
      - description: request
        name: request
        in: body
        required: true
        schema:
          $ref: '#/definitions/node.KeyGenRequestAgreePost'
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
  /keyGenEjectRequest:
    post:
