definitions:
  node.APIResponse:
    properties:
      code:
        description: 0 succes, 1 error
        type: integer
      data: {}
      error:
        type: string
    type: object
  node.KeyGenRequestAgreePost:
    properties:
      clientPk:
        type: string
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
    type: object
  node.KeyGenRequestPost:
    properties:
      clientPk:
        type: string
      groupId:
        type: string
      keyType:
        type: string
      msgCheck:
        type: string
      nonce:
        type: integer
      sig:
        type: string
      threshold:
        type: integer
    type: object
  node.NewGroupRequestAgreePost:
    properties:
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
    type: object
  node.NewGroupRequestPost:
    properties:
      BrokerArray:
        items:
          type: string
        type: array
      keyList:
        items:
          type: string
        type: array
      nonce:
        type: integer
      sig:
        type: string
    type: object
  node.PresignRequestPost:
    properties:
      keyList:
        items:
          type: string
        type: array
      nonce:
        type: integer
      presignAmt:
        type: integer
      pubKey:
        type: string
      sig:
        type: string
    type: object
  node.PresinRequestAgreePost:
    properties:
      nonce:
        type: integer
      requestId:
        type: string
      sig:
        type: string
    type: object
  node.RelayerRegisterRequest:
    properties:
      allowedChains:
        description: Empty means all chains allowed
        items:
          type: string
        type: array
      metadata:
        additionalProperties:
          type: string
        type: object
      registeredBy:
        type: string
      relayerName:
        type: string
      relayerPublicKey:
        description: Single public key for initial registration
        type: string
    required:
    - relayerName
    - relayerPublicKey
    type: object
  node.RelayerUpdateRequest:
    properties:
      publicKeys:
        description: New array of public keys (must include at least one)
        items:
          type: string
        type: array
      relayerPublicKey:
        description: Public key used to sign this request
        type: string
      relayerSignature:
        description: Signature of this request
        type: string
    required:
    - publicKeys
    - relayerPublicKey
    - relayerSignature
    type: object
  node.NodeRegisterRequest:
    properties:
      nodeName:
        description: Node name (required, at least 6 characters)
        type: string
        minLength: 6
      forumHandle:
        description: Telegram or X handle
        type: string
      forumType:
        description: "Telegram or X"
        type: string
      email:
        description: Email address
        type: string
      vpsProvider:
        description: VPS provider or "self-hosted"
        type: string
      ramGB:
        description: RAM in GB
        type: number
      cpuCores:
        description: CPU core count
        type: integer
      didType:
        description: Optional DID type
        type: string
      did:
        description: Optional DID identifier
        type: string
      nodeMgtKeySig:
        description: Signature from NodeMgtKey private key
        type: string
      nonce:
        description: Nonce for signature
        type: integer
    required:
    - nodeName
    - forumHandle
    - forumType
    - email
    - vpsProvider
    - ramGB
    - cpuCores
    - nodeMgtKeySig
    - nonce
    type: object
  node.NodeRegistration:
    properties:
      nodeName:
        description: Node name (at least 6 characters)
        type: string
      nodeId:
        description: Node ID in format http://ip:port or https://ip:port
        type: string
      nodePublicKey:
        description: Node's public key (128 hex chars)
        type: string
      nodeMgtKey:
        description: Node management key (Ethereum address)
        type: string
      relayerPublicKey:
        description: Relayer's public key (128 hex chars)
        type: string
      forumHandle:
        description: Telegram or X handle
        type: string
      forumType:
        description: "Telegram or X"
        type: string
      email:
        description: Email address
        type: string
      vpsProvider:
        description: VPS provider or "self-hosted"
        type: string
      ramGB:
        description: RAM in GB
        type: number
      cpuCores:
        description: CPU core count
        type: integer
      didType:
        description: Optional DID type
        type: string
      did:
        description: Optional DID identifier
        type: string
      mpcGroups:
        description: Array of MPC groups this node belongs to
        items:
          $ref: '#/definitions/node.MPCGroupInfo'
        type: array
      createdAt:
        description: ISO 8601 timestamp
        type: string
    type: object
  node.MPCGroupInfo:
    properties:
      groupId:
        description: Group ID (deterministic hash)
        type: string
      keyList:
        description: Array of node public keys
        items:
          type: string
        type: array
      nodeAddresses:
        additionalProperties:
          type: string
        description: Map of nodeKey to IP:port
        type: object
      threshold:
        description: Threshold value
        type: integer
    type: object
  node.SignRequestAgreePost:
    properties:
      clientSig:
        type: string
      requestId:
        type: string
    type: object
  node.SignRequestPost:
    properties:
      chainID:
        description: 'Optional: for chain access control'
        type: string
      clientSig:
        description: signed by clientpk saved when keygen
        type: string
      keyList:
        items:
          type: string
        type: array
      msgHash:
        type: string
      msgRaw:
        type: string
      presignId:
        description: presignId of presign, instead of requestId of presign
        type: string
      pubKey:
        type: string
      relayerPublicKey:
        description: Relayer authentication fields
        type: string
      relayerSignature:
        type: string
      sourceChainID:
        description: Chain ID of the source transaction
        type: string
      sourceTxHash:
        description: 'NEW: Source transaction information for pre-signing verification'
        type: string
      destinationChainID:
        description: Destination chain ID (stored and returned in listSignRequests / getSignRequestById)
        type: string
      destinationAddress:
        description: Destination address (stored and returned in listSignRequests / getSignRequestById)
        type: string
      extraJSON:
        description: Arbitrary JSON string for node context (stored and returned in listSignRequests / getSignRequestById)
        type: string
    type: object
info:
  contact: {}
paths:
  /addNeighborNodes:
    get:
      consumes:
      - application/json
      description: add neighbor nodes
      parameters:
      - description: name
        in: query
        name: name
        required: true
        type: string
      - description: key
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/node.APIResponse'
      summary: add neighbor nodes
      tags:
      - Neighbor Nodes Mgt
  /admin/getRelayer:
    get:
      consumes:
      - application/json
      description: get relayer by public key
      parameters:
