      chainName:
        type: string
      rpcGateway:
        type: string
      explorer:
        type: string
      legacy:
        type: boolean
      testnet:
        type: boolean
      gasName:
        type: string
      gasLimit:
        type: number
      baseFee:
        type: number
        description: Optional; may be null if not stored
      priorityFee:
        type: number
        description: Optional; may be null if not stored
      baseFeeMultiplier:
        type: number
      gasMultiplier:
        type: number
      gasPrice:
        type: number
      defaultGetSigFeeSpeed:
        type: string
        description: Optional. slow | normal | fast. Omitted on legacy stored configs; clients default to normal.
        enum:
