  node.PostBootstrapKeyPost:
    type: object
    description: POST /postBootstrapKey signed body (verify with clientSig cleared). 32-byte Ed25519 seed as 64 hex chars
      (same as fetchBootstrapKey ed25519PrivateSeedHex). If configs.yaml PublicMgtKey is set, seed must match it.
    allOf:
    - $ref: '#/definitions/node.NodeMgtKeySig'
    - type: object
      required:
      - ed25519PrivateSeedHex
      properties:
        ed25519PrivateSeedHex:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
          description: 32-byte Ed25519 seed as 64 hex characters
  node.RemoveBootstrapKeyPost:
    type: object
    description: POST /removeBootstrapKey signed body (nonce, clientSig, nodeKey).
    allOf:
    - $ref: '#/definitions/node.NodeMgtKeySig'
  node.AddManagementKeyPost:
    type: object
    description: 'Canonical UTF-8 string to sign: JSON `{"nonce":N,"clientSig":"","nodeKey":"<128-hex>"}`. The node generates
      an Ed25519 key pair and writes PKCS#8 PEM plus `.pub` files under `/app/added_keys/added_key_<N>` (continuum-mcp-server
      layout). **Ed25519:** set `clientSig` to 128 hex (allowed bootstrap or added Ed25519 management key); omit `signedMessage`.
      Nonce from `GET /getPublicMgtKeyNonce` (add `?publicKey=` when signer is not the default config key). **Ethereum:**
      `signedMessage` must equal that exact canonical string byte-for-byte; `clientSig` is EIP-191 `personal_sign` from `configs.yaml`
      `NodeMgtKey`. Nonce from `GET /getNodeMgtKeyNonce`. Requires `nodeKey` (GET /getNodeKey). Requires `NodeMgtKey` on node
      for Ethereum mode.'
    required:
    - nonce
    - nodeKey
    properties:
      nonce:
        type: integer
        description: Anti-replay nonce.
      clientSig:
        type: string
        description: Ed25519 128 hex, or EIP-191 when signedMessage is set.
      signedMessage:
        type: string
        description: Must equal canonical JSON exactly (Ethereum).
      nodeKey:
        type: string
        description: Required MPC node public key (128 hex from GET /getNodeKey).
  node.RemoveManagementKeyPost:
    type: object
    description: 'Canonical UTF-8 string to sign: JSON `{"publicKey":"<64-hex-lowercase-target>","nonce":N,"clientSig":"","nodeKey":"<128-hex>"}`.
      Also removes `/app/added_keys/added_key_<N>` and `added_key_<N>.pub` when present. **Ed25519:** `clientSig` 128 hex
      from an allowed key **other than** `publicKey`; nonce from `GET /getPublicMgtKeyNonce` for the **signer**. **Ethereum:**
      `signedMessage` must equal canonical string; `clientSig` EIP-191 from `NodeMgtKey`; nonce from `GET /getNodeMgtKeyNonce`.'
    required:
    - publicKey
    - nodeKey
    properties:
      publicKey:
        type: string
        description: 64 hex — key added via POST /addManagementKey to soft-remove (not bootstrap PublicMgtKey).
      nonce:
        type: integer
        description: Anti-replay nonce.
      clientSig:
        type: string
        description: Ed25519 128 hex, or EIP-191 when signedMessage is set.
      signedMessage:
        type: string
        description: Canonical JSON exactly (Ethereum).
      nodeKey:
        type: string
        description: Required MPC node public key (128 hex from GET /getNodeKey).
  node.KeyGenEjectRequestPost:
    type: object
    description: 'POST /keyGenEjectRequest. Starts multi-agree eject for a completed keygen (`keyGenId` = keygen request id).
      Supported key types: secp256k1 (CGGMP24), ed25519 (FROST/givre), bitcoin-taproot (FROST/givre). Requires msgCheck multi-agree.
      Rejects tx-check, legacy GG18 secp256k1, and already-ejected keygens. Requires management proof: verify with **clientSig**
      cleared over canonical JSON including **nonce**, **nodeKey**, **keyGenId**, optional **purpose**. Finalization requires
      mpc-auth built with -tags rust. See mpc-config docs/references/API_IMPLEMENTATION.md.'
    required:
    - nonce
    - clientSig
    - nodeKey
    - keyGenId
    properties:
      nonce:
        type: integer
        description: Anti-replay nonce from GET /getNodeMgtKeyNonce or GET /getPublicMgtKeyNonce
      clientSig:
        type: string
        description: Management signature over canonical JSON with clientSig as empty string
      nodeKey:
        type: string
        description: Required. 128-hex MPC node id from GET /getNodeKey — binds signature to this node.
      keyGenId:
        type: string
        description: Keygen request id (same as GET /getKeyGenResultById ?id=).
      purpose:
        type: string
        description: Optional originator rationale stored on the eject request.
  node.KeyGenEjectAgreePost:
    type: object
    description: 'POST /keyGenEjectAgree. Committee member vote with **management** signature (same pattern as signRequestAgree
      — nonce, nodeKey, clientSig over json.Marshal with clientSig cleared). **Reject** (`accept`: false) is recorded for
      audit only and does **not** veto the eject once signing-quorum accepts exist.'
    required:
    - ejectRequestId
    - nonce
    - clientSig
    - nodeKey
    properties:
      ejectRequestId:
        type: string
        description: Id returned in POST /keyGenEjectRequest data.ejectRequestId
      nonce:
        type: integer
        description: Anti-replay nonce from GET /getPublicMgtKeyNonce or GET /getNodeMgtKeyNonce
      nodeKey:
        type: string
        description: Required. 128-hex MPC node id from GET /getNodeKey
      clientSig:
        type: string
        description: Management signature over canonical JSON with clientSig cleared
      accept:
        type: boolean
        description: false = reject (audit-only); omit or true = accept
      thoughts:
        type: string
        description: Optional comment; max 256 chars server-side
  node.GetEthereumPrivateKeyPost:
    type: object
    description: POST /getEthereumPrivateKey. Returns decrypted **64-hex** secp256k1 scalar after successful eject, plus Bitcoin
      mainnet **privateKeyWif** / **bitcoinPrivateKeyWif** (compressed WIF) and **bitcoinP2WPKHMainnet** when derivable from
      the same scalar. Requires management proof (nonce, clientSig with clientSig cleared, nodeKey). Caller node must be in
      the keygen **KeyList**; keygen result **keygenresultstatus** must be **ejected** on this node. After eject, each KeyList
      participant stores export ciphertext locally (encrypted to that node's key); use POST /getEthereumPrivateKey on any
      participant that completed local finalize.
    required:
    - nonce
    - clientSig
    - nodeKey
    - keyGenId
    properties:
      nonce:
        type: integer
      clientSig:
        type: string
      nodeKey:
        type: string
        description: Required 128-hex MPC node id binding
      keyGenId:
        type: string
        description: Keygen request id
  node.KeyGenEjectRequestResult:
    type: object
    description: One key eject flow returned by GET /listKeyGenEjectRequests and GET /getKeyGenEjectRequestById (secp256k1,
      ed25519, or bitcoin-taproot multi-agree keygens). Only ejects where this node's key appears in KeyList are listed.
    properties:
      requestid:
        type: string
        description: Eject request id (ejectRequestId from POST /keyGenEjectRequest)
      KeyGenId:
        type: string
        description: Target keygen request id
      KeyList:
        type: array
        items:
          type: string
        description: Committee node public keys (128 hex)
      SigList:
        type: object
        additionalProperties:
          type: string
        description: Node key → management signature hex (empty when not yet agreed)
      ClientSigs:
        type: object
        additionalProperties:
          type: string
      Purpose:
        type: object
        additionalProperties:
          type: string
      Thoughts:
        type: object
        additionalProperties:
          type: string
      RejectedBy:
        type: array
        items:
          type: string
      timepoint:
        type: string
      status:
        type: string
        description: Eject lifecycle on this node (e.g. live, eject_share_phase, done)
      originator:
        type: string
        description: Node key that started the eject (MsgPb.From)
  node.GetBitcoinPrivateKeyPost:
    type: object
    description: POST /getBitcoinPrivateKey. Returns Bitcoin mainnet compressed **privateKeyWif** for the ejected secp256k1
      scalar (same underlying key as POST /getEthereumPrivateKey). Also returns **privateKeyHex** and **bitcoinP2WPKHMainnet**.
      Requires management proof (nonce, clientSig with clientSig cleared, nodeKey). Caller node must be in the keygen **KeyList**;
      keygen result **keygenresultstatus** must be **ejected** on this node. **secp256k1 only.**
    required:
    - nonce
    - clientSig
    - nodeKey
    - keyGenId
    properties:
      nonce:
        type: integer
      clientSig:
        type: string
      nodeKey:
        type: string
        description: Required 128-hex MPC node id binding
      keyGenId:
        type: string
        description: Keygen request id
  node.EffectiveSchnorrMpcProtocol:
    type: string
    description: 'Runtime Schnorr MPC variant for ed25519 / bitcoin-taproot: "givre" (FROST). Empty for secp256k1. API-only
      JSON on keygen/sign GET responses.'
  node.GetEd25519PrivateKeyPost:
    type: object
    description: POST /getEd25519PrivateKey. Returns decrypted **64-hex Ed25519 seed** after successful FROST ed25519 eject,
      plus Solana, NEAR, Stellar/Soroban, TON, and Sui wallet import fields when derivable. Requires management proof (nonce,
      clientSig with clientSig cleared, nodeKey). Caller node must be in the keygen **KeyList**; keygen **keytype** must be
      **ed25519**; **keygenresultstatus** must be **ejected** on this node.
    required:
    - nonce
    - clientSig
    - nodeKey
    - keyGenId
    properties:
      nonce:
        type: integer
      clientSig:
        type: string
      nodeKey:
        type: string
        description: Required 128-hex MPC node id binding
      keyGenId:
        type: string
        description: Keygen request id
  node.GetTaprootPrivateKeyPost:
    type: object
    description: POST /getTaprootPrivateKey. Returns Taproot internal key scalar, internal/output x-only pubkeys, P2TR addresses,
      and optional Bitcoin mainnet WIF after successful FROST bitcoin-taproot eject. Requires management proof (nonce, clientSig
      with clientSig cleared, nodeKey). Caller node must be in the keygen **KeyList**; keygen **keytype** must be **bitcoin-taproot**;
      **keygenresultstatus** must be **ejected** on this node.
    required:
    - nonce
    - clientSig
    - nodeKey
    - keyGenId
    properties:
      nonce:
        type: integer
      clientSig:
        type: string
      nodeKey:
        type: string
        description: Required 128-hex MPC node id binding
      keyGenId:
        type: string
        description: Keygen request id
  node.RemoveChainDetailsPost:
    type: object
    allOf:
    - *id001
    - type: object
      required:
      - chainId
      properties:
        chainId:
          type: string
  node.PostNonEvmChainDetailsPost:
    type: object
    allOf:
    - *id001
    - type: object
      required:
      - chainType
      - chainId
      - chainName
      - rpcGateway
      - endpointKind
      - nativeSymbol
      - nativeDecimals
      properties:
        chainType:
