    properties:
      nonce:
        type: integer
        description: Anti-replay nonce from GET /getNodeMgtKeyNonce or GET /getPublicMgtKeyNonce
      clientSig:
        type: string
        description: Management signature over canonical JSON with clientSig cleared (Ed25519 128 hex or EIP-191)
      nodeKey:
        type: string
        description: Required. This node's MPC public key (128 hex from GET /getNodeKey); binds the signature to this node
  node.BackupDatabasePost:
    type: object
